fish = '''
function honcho-info
    set -l cfg "$HONCHO_CONFIG_DIR/config.toml"
    echo "Honcho Environment Configuration"
    echo ""
    set -l health (curl -fsS -m 2 "$HONCHO_URL/health" 2>/dev/null)
    or set health "not running (flox services start)"
    echo "API: $HONCHO_URL ($health)"
    if test "$DB_CONNECTION_URI" = "$HONCHO_LOCAL_DB_URI"
        echo "Database: bundled PostgreSQL, data in $HONCHO_PGDATA"
        echo "  psql -h \"\$HONCHO_PG_SOCKET_DIR\" -U honcho honcho"
    else
        echo "Database: DB_CONNECTION_URI (external)"
    end
    if test -e "$HONCHO_CONFIG_DIR"; and not test -d "$HONCHO_CONFIG_DIR" -a -x "$HONCHO_CONFIG_DIR"
        echo "Config: $HONCHO_CONFIG_DIR isn't a directory you can enter; settings come only from the environment"
    else if test -f "$cfg"
        echo "Config: $cfg (found)"
    else
        echo "Config: $cfg (not created)"
    end
    if test -f "$HONCHO_DATA_DIR/embed-messages"
        echo "Embed messages: "(cat "$HONCHO_DATA_DIR/embed-messages")
    else
        echo "Embed messages: decided when honcho-api starts"
    end
    echo "Logs: $FLOX_ENV_CACHE/logs/honcho-*.log"
    echo ""
    echo "LLM keys (environment, or config.toml / .env in the config directory):"
    echo "  LLM_OPENAI_API_KEY      also used for embeddings by default"
    echo "  LLM_ANTHROPIC_API_KEY   LLM_GEMINI_API_KEY"
    echo "  LLM_OPENAI_BASE_URL     an OpenAI-compatible server (Ollama, vLLM, ...)"
    echo ""
    echo "Commands:"
    echo "  flox services status          PostgreSQL, API, and deriver"
    echo "  tail -f \"\$FLOX_ENV_CACHE/logs/honcho-api.log\""
    echo "  curl \$HONCHO_URL/health"
    echo "  python                        Python with the honcho-ai SDK (from honcho import Honcho)"
    echo "  honcho-migrate current        Show the schema revision"
    echo ""
    echo "Source: https://github.com/plastic-labs/honcho"
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
