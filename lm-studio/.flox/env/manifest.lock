{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.11.0",
    "install": {
      "bat": {
        "pkg-path": "bat"
      },
      "curl": {
        "pkg-path": "curl"
      },
      "lmstudio": {
        "pkg-path": "flox/lmstudio",
        "pkg-group": "lmstudio"
      }
    },
    "hook": {
      "on-activate": "# === SERVER CONFIGURATION ===\nexport LMS_PORT=\"${LMS_PORT:-1234}\"\nexport LMS_HOST=\"${LMS_HOST:-127.0.0.1}\"\nexport LMS_GUI=\"${LMS_GUI:-false}\"\nexport LMS_CORS_ORIGIN=\"${LMS_CORS_ORIGIN:-*}\"\n\n# === DATA DIRECTORIES ===\nexport LMS_LOG_DIR=\"$FLOX_ENV_CACHE/logs\"\nmkdir -p \"$LMS_LOG_DIR\"\n\n# === DISPLAY CONFIGURATION ===\necho \"\"\necho \"LM Studio environment ready\"\necho \"\"\necho \"Server:\"\necho \"  API: http://${LMS_HOST}:${LMS_PORT}\"\necho \"  GUI: ${LMS_GUI}\"\necho \"\"\necho \"Commands:\"\necho \"  flox activate -s          Start headless LM Studio server\"\necho \"  lms get <model>           Download a model from Hugging Face\"\necho \"  lms load <model>          Load a model into memory\"\necho \"  lms chat                  Interactive terminal chat\"\necho \"  lmstudio-info             Show configuration\"\necho \"  lmstudio-health           Test API endpoint\"\necho \"\"\necho \"Examples:\"\necho \"  lms get bartowski/Meta-Llama-3.1-8B-Instruct-GGUF\"\necho \"  LMS_HOST=0.0.0.0 flox activate -s          # Listen on all interfaces\"\necho \"  LMS_PORT=8080 flox activate -s              # Custom port\"\necho \"  LMS_GUI=true flox activate                  # Launch GUI on activation\"\necho \"\"\n"
    },
    "profile": {
      "bash": "lmstudio-info() {\n    echo \"LM Studio Environment Configuration\"\n    echo \"\"\n    echo \"Server:\"\n    echo \"  Host: ${LMS_HOST}\"\n    echo \"  Port: ${LMS_PORT}\"\n    echo \"  API:  http://${LMS_HOST}:${LMS_PORT}\"\n    echo \"  GUI:  ${LMS_GUI}\"\n    echo \"  CORS: ${LMS_CORS_ORIGIN}\"\n    echo \"\"\n    echo \"Logs: ${LMS_LOG_DIR}/lm-studio.log\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  lms get <model>           Download a model\"\n    echo \"  lms load <model>          Load a model into memory\"\n    echo \"  lms chat                  Interactive terminal chat\"\n    echo \"  lms server status         Check server status\"\n    echo \"  flox services status      Check service status\"\n    echo \"  flox services logs        View service logs\"\n    echo \"  lmstudio-health           Test API endpoint\"\n    echo \"\"\n    echo \"Runtime Override Examples:\"\n    echo \"  LMS_HOST=0.0.0.0 flox activate -s\"\n    echo \"  LMS_PORT=8080 flox activate -s\"\n    echo \"  LMS_GUI=true flox activate\"\n}\nexport -f lmstudio-info\n\nlmstudio-health() {\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n\n    if curl -sf \"http://${HOST}:${PORT}/v1/models\" >/dev/null 2>&1; then\n        echo \"LM Studio API is healthy at http://${HOST}:${PORT}\"\n        echo \"\"\n        echo \"Loaded models:\"\n        curl -sf \"http://${HOST}:${PORT}/v1/models\" 2>/dev/null | python3 -m json.tool 2>/dev/null || \\\n            curl -sf \"http://${HOST}:${PORT}/v1/models\" 2>/dev/null\n        return 0\n    else\n        echo \"LM Studio API is not responding at http://${HOST}:${PORT}\"\n        echo \"  Try: flox services status\"\n        echo \"  Logs: $LMS_LOG_DIR/lm-studio.log\"\n        return 1\n    fi\n}\nexport -f lmstudio-health\n\n# Optionally launch GUI on activation\nif [ \"${LMS_GUI}\" = \"true\" ]; then\n    lm-studio &\nfi\n",
      "zsh": "lmstudio-info() {\n    echo \"LM Studio Environment Configuration\"\n    echo \"\"\n    echo \"Server:\"\n    echo \"  Host: ${LMS_HOST}\"\n    echo \"  Port: ${LMS_PORT}\"\n    echo \"  API:  http://${LMS_HOST}:${LMS_PORT}\"\n    echo \"  GUI:  ${LMS_GUI}\"\n    echo \"  CORS: ${LMS_CORS_ORIGIN}\"\n    echo \"\"\n    echo \"Logs: ${LMS_LOG_DIR}/lm-studio.log\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  lms get <model>           Download a model\"\n    echo \"  lms load <model>          Load a model into memory\"\n    echo \"  lms chat                  Interactive terminal chat\"\n    echo \"  lms server status         Check server status\"\n    echo \"  flox services status      Check service status\"\n    echo \"  flox services logs        View service logs\"\n    echo \"  lmstudio-health           Test API endpoint\"\n    echo \"\"\n    echo \"Runtime Override Examples:\"\n    echo \"  LMS_HOST=0.0.0.0 flox activate -s\"\n    echo \"  LMS_PORT=8080 flox activate -s\"\n    echo \"  LMS_GUI=true flox activate\"\n}\n\nlmstudio-health() {\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n\n    if curl -sf \"http://${HOST}:${PORT}/v1/models\" >/dev/null 2>&1; then\n        echo \"LM Studio API is healthy at http://${HOST}:${PORT}\"\n        echo \"\"\n        echo \"Loaded models:\"\n        curl -sf \"http://${HOST}:${PORT}/v1/models\" 2>/dev/null | python3 -m json.tool 2>/dev/null || \\\n            curl -sf \"http://${HOST}:${PORT}/v1/models\" 2>/dev/null\n        return 0\n    else\n        echo \"LM Studio API is not responding at http://${HOST}:${PORT}\"\n        echo \"  Try: flox services status\"\n        echo \"  Logs: $LMS_LOG_DIR/lm-studio.log\"\n        return 1\n    fi\n}\n\n# Optionally launch GUI on activation\nif [ \"${LMS_GUI}\" = \"true\" ]; then\n    lm-studio &\nfi\n",
      "fish": "function lmstudio-info\n    echo \"LM Studio Environment Configuration\"\n    echo \"\"\n    echo \"Server:\"\n    echo \"  Host: $LMS_HOST\"\n    echo \"  Port: $LMS_PORT\"\n    echo \"  API:  http://$LMS_HOST:$LMS_PORT\"\n    echo \"  GUI:  $LMS_GUI\"\n    echo \"  CORS: $LMS_CORS_ORIGIN\"\n    echo \"\"\n    echo \"Logs: $LMS_LOG_DIR/lm-studio.log\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  lms get <model>           Download a model\"\n    echo \"  lms load <model>          Load a model into memory\"\n    echo \"  lms chat                  Interactive terminal chat\"\n    echo \"  lms server status         Check server status\"\n    echo \"  flox services status      Check service status\"\n    echo \"  flox services logs        View service logs\"\n    echo \"  lmstudio-health           Test API endpoint\"\n    echo \"\"\n    echo \"Runtime Override Examples:\"\n    echo \"  LMS_HOST=0.0.0.0 flox activate -s\"\n    echo \"  LMS_PORT=8080 flox activate -s\"\n    echo \"  LMS_GUI=true flox activate\"\nend\n\nfunction lmstudio-health\n    set -l HOST (test -n \"$LMS_HOST\"; and echo \"$LMS_HOST\"; or echo \"127.0.0.1\")\n    set -l PORT (test -n \"$LMS_PORT\"; and echo \"$LMS_PORT\"; or echo \"1234\")\n\n    if curl -sf \"http://$HOST:$PORT/v1/models\" >/dev/null 2>&1\n        echo \"LM Studio API is healthy at http://$HOST:$PORT\"\n        echo \"\"\n        echo \"Loaded models:\"\n        curl -sf \"http://$HOST:$PORT/v1/models\" 2>/dev/null | python3 -m json.tool 2>/dev/null; or \\\n            curl -sf \"http://$HOST:$PORT/v1/models\" 2>/dev/null\n        return 0\n    else\n        echo \"LM Studio API is not responding at http://$HOST:$PORT\"\n        echo \"  Try: flox services status\"\n        echo \"  Logs: $LMS_LOG_DIR/lm-studio.log\"\n        return 1\n    end\nend\n\n# Optionally launch GUI on activation\nif test \"$LMS_GUI\" = \"true\"\n    lm-studio &\nend\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "lm-studio": {
        "command": "exec lms daemon up 2>&1 | tee -a \"$LMS_LOG_DIR/lm-studio.log\" &\nDAEMON_PID=$!\n\n# Wait for daemon to be ready\nfor i in $(seq 1 30); do\n  if lms status >/dev/null 2>&1; then\n    break\n  fi\n  sleep 1\ndone\n\nif ! lms status >/dev/null 2>&1; then\n  echo \"ERROR: LM Studio daemon failed to start after 30s\" >&2\n  echo \"Check logs: $LMS_LOG_DIR/lm-studio.log\" >&2\n  exit 1\nfi\n\necho \"LM Studio daemon is up, starting API server on ${LMS_HOST}:${LMS_PORT}...\"\nexec lms server start --port \"$LMS_PORT\" --host \"$LMS_HOST\" --cors-origin \"$LMS_CORS_ORIGIN\" 2>&1 | tee -a \"$LMS_LOG_DIR/lm-studio.log\"\n",
        "is-daemon": false
      }
    }
  },
