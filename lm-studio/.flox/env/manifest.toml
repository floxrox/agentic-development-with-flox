function lmstudio-health
    set -l HOST (test -n "$LMS_HOST"; and echo "$LMS_HOST"; or echo "127.0.0.1")
    set -l PORT (test -n "$LMS_PORT"; and echo "$LMS_PORT"; or echo "1234")

    if curl -sf "http://$HOST:$PORT/v1/models" >/dev/null 2>&1
        echo "LM Studio API is healthy at http://$HOST:$PORT"
        echo ""
        echo "Loaded models:"
        curl -sf "http://$HOST:$PORT/v1/models" 2>/dev/null | python3 -m json.tool 2>/dev/null; or \
            curl -sf "http://$HOST:$PORT/v1/models" 2>/dev/null
        return 0
    else
        echo "LM Studio API is not responding at http://$HOST:$PORT"
        echo "  Try: flox services status"
        echo "  Logs: $LMS_LOG_DIR/lm-studio.log"
        return 1
    end
end

# Optionally launch GUI on activation
if test "$LMS_GUI" = "true"
    lm-studio &
end
'''

