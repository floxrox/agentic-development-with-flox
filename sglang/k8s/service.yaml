apiVersion: v1
kind: Service
metadata:
  name: sglang
  namespace: sglang
  labels:
    app.kubernetes.io/name: sglang
spec:
  # ClusterIP for internal access. Change to LoadBalancer or NodePort for
  # external access, or front with an Ingress resource.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sglang
  ports:
    - name: http
      port: 30000
      targetPort: http
      protocol: TCP
