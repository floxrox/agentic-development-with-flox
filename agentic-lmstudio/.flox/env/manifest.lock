    "hook": {
      "on-activate": "# === SERVER CONFIGURATION ===\nexport LMS_PORT=\"${LMS_PORT:-1234}\"\nexport LMS_HOST=\"${LMS_HOST:-127.0.0.1}\"\nexport LMS_GUI=\"${LMS_GUI:-false}\"\nexport LMS_CORS_ORIGIN=\"${LMS_CORS_ORIGIN:-*}\"\nexport LMS_CONTEXT_LENGTH=\"${LMS_CONTEXT_LENGTH:-131072}\"\n\n# Constructed base URL for helper functions\nexport LMS_API_BASE=\"http://${LMS_HOST}:${LMS_PORT}\"\n\n# === DATA DIRECTORIES ===\nexport LMS_LOG_DIR=\"$FLOX_ENV_CACHE/logs\"\nmkdir -p \"$LMS_LOG_DIR\"\n\n# === GPU DETECTION ===\nexport _FLOX_ENV_CUDA_DETECTION=0\nif command -v nvidia-smi >/dev/null 2>&1; then\n  if nvidia-smi -L 2>/dev/null | grep -q \"GPU\"; then\n    export _FLOX_ENV_CUDA_DETECTION=1\n  fi\nfi\n\n# === DISPLAY CONFIGURATION ===\necho \"\"\necho \"LM Studio + Agentic Tools environment ready\"\necho \"\"\necho \"Server:\"\necho \"  API: ${LMS_API_BASE}\"\necho \"  GUI: ${LMS_GUI}\"\nif [ \"$_FLOX_ENV_CUDA_DETECTION\" = \"1\" ]; then\n  echo \"  GPU: Available (CUDA detected)\"\nelse\n  echo \"  GPU: Not detected (CPU mode)\"\nfi\necho \"\"\necho \"Quick Start:\"\necho \"  flox activate -s                                  Start LM Studio server\"\necho \"  lms-launch claude --model zai-org/glm-4.7-flash   Download, load, launch\"\necho \"\"\necho \"  Context window: ${LMS_CONTEXT_LENGTH} (override: --context-length or LMS_CONTEXT_LENGTH)\"\nif [ \"$_FLOX_ENV_CUDA_DETECTION\" = \"1\" ]; then\n  echo \"  GPU: auto-detected (override: --gpu max|off)\"\nelse\n  echo \"  GPU: not detected (override: --gpu max|off)\"\nfi\necho \"\"\necho \"Commands:\"\necho \"  lms-launch <tool> --model <m> [args]      Download, load, and launch tool\"\necho \"  lms ls                                    List loaded models\"\necho \"  lmstudio-info                             Show configuration\"\necho \"  lmstudio-health                           Test API endpoint\"\necho \"  helpf                                     View full README documentation\"\necho \"\"\n\n# Fetch README.md if not present\nREADME_FILE=\"$FLOX_ENV_PROJECT/README.md\"\nif [ ! -f \"$README_FILE\" ]; then\n  if curl -fsSL https://raw.githubusercontent.com/floxrox/agentic-development-with-flox/main/agentic-lmstudio/README.md -o \"$README_FILE\" 2>/dev/null; then\n    echo \"Downloaded README.md (use 'helpf' to view)\"\n  fi\nfi\n"
    },
    "profile": {
      "bash": "# Wait for API server if services are starting\nif [ \"${FLOX_ACTIVATE_START_SERVICES:-}\" = \"true\" ]; then\n  printf \"Waiting for LM Studio API\"\n  _lms_ready=false\n  for _i in $(seq 1 30); do\n    if curl -sf \"http://${LMS_HOST}:${LMS_PORT}/v1/models\" >/dev/null 2>&1; then\n      _lms_ready=true\n      break\n    fi\n    printf \".\"\n    sleep 2\n  done\n  if [ \"$_lms_ready\" = \"true\" ]; then\n    echo \" ready!\"\n  else\n    echo \" not responding (check: flox services logs lm-studio)\"\n  fi\nfi\n\nhelpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/floxrox/agentic-development-with-flox/main/agentic-lmstudio/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    elif [ ! -f \"$README_FILE\" ]; then\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"README.md not found at $README_FILE\"\n        return 1\n    fi\n}\nexport -f helpf\n\n# Optionally launch GUI on activation\nif [ \"${LMS_GUI}\" = \"true\" ]; then\n    lm-studio &\nfi\n",
      "zsh": "# Wait for API server if services are starting\nif [ \"${FLOX_ACTIVATE_START_SERVICES:-}\" = \"true\" ]; then\n  printf \"Waiting for LM Studio API\"\n  _lms_ready=false\n  for _i in $(seq 1 30); do\n    if curl -sf \"http://${LMS_HOST}:${LMS_PORT}/v1/models\" >/dev/null 2>&1; then\n      _lms_ready=true\n      break\n    fi\n    printf \".\"\n    sleep 2\n  done\n  if [ \"$_lms_ready\" = \"true\" ]; then\n    echo \" ready!\"\n  else\n    echo \" not responding (check: flox services logs lm-studio)\"\n  fi\nfi\n\nhelpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/floxrox/agentic-development-with-flox/main/agentic-lmstudio/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    elif [ ! -f \"$README_FILE\" ]; then\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"README.md not found at $README_FILE\"\n        return 1\n    fi\n}\n\n# Optionally launch GUI on activation\nif [ \"${LMS_GUI}\" = \"true\" ]; then\n    lm-studio &\nfi\n",
      "fish": "# Wait for API server if services are starting\nif test \"$FLOX_ACTIVATE_START_SERVICES\" = \"true\"\n  printf \"Waiting for LM Studio API\"\n  set _lms_ready false\n  for _i in (seq 1 30)\n    if curl -sf \"http://$LMS_HOST:$LMS_PORT/v1/models\" >/dev/null 2>&1\n      set _lms_ready true\n      break\n    end\n    printf \".\"\n    sleep 2\n  end\n  if test \"$_lms_ready\" = \"true\"\n    echo \" ready!\"\n  else\n    echo \" not responding (check: flox services logs lm-studio)\"\n  end\nend\n\nfunction helpf\n    set README_FILE \"$FLOX_ENV_PROJECT/README.md\"\n    set README_URL \"https://raw.githubusercontent.com/floxrox/agentic-development-with-flox/main/agentic-lmstudio/README.md\"\n\n    if test \"$argv[1]\" = \"--help\"\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    end\n\n    if test \"$argv[1]\" = \"--force\"\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        end\n    else if not test -f \"$README_FILE\"\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        end\n    end\n\n    if test -f \"$README_FILE\"\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"README.md not found at $README_FILE\"\n        return 1\n    end\nend\n\n# Optionally launch GUI on activation\nif test \"$LMS_GUI\" = \"true\"\n    lm-studio &\nend\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "lm-studio": {
        "command": "lms-service",
        "is-daemon": false
      }
    }
