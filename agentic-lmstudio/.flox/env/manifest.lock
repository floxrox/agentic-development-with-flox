{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.11.0",
    "install": {
      "bat": {
        "pkg-path": "bat",
        "pkg-group": "tools"
      },
      "claude-code": {
        "pkg-path": "claude-code",
        "pkg-group": "agentic",
        "outputs": "all"
      },
      "codex": {
        "pkg-path": "codex",
        "pkg-group": "agentic",
        "outputs": "all"
      },
      "curl": {
        "pkg-path": "curl",
        "pkg-group": "tools",
        "outputs": "all"
      },
      "flox-mcp-server": {
        "pkg-path": "flox/flox-mcp-server",
        "pkg-group": "mcp",
        "systems": [
          "aarch64-darwin",
          "aarch64-linux",
          "x86_64-linux"
        ],
        "outputs": "all"
      },
      "jq": {
        "pkg-path": "jq",
        "pkg-group": "tools"
      },
      "lmstudio": {
        "pkg-path": "flox/lmstudio",
        "pkg-group": "lmstudio"
      },
      "opencode": {
        "pkg-path": "opencode",
        "pkg-group": "agentic",
        "outputs": "all"
      },
      "strace": {
        "pkg-path": "strace",
        "systems": [
          "aarch64-linux",
          "x86_64-linux"
        ]
      }
    },
    "hook": {
      "on-activate": "# === SERVER CONFIGURATION ===\nexport LMS_PORT=\"${LMS_PORT:-1234}\"\nexport LMS_HOST=\"${LMS_HOST:-127.0.0.1}\"\nexport LMS_GUI=\"${LMS_GUI:-false}\"\nexport LMS_CORS_ORIGIN=\"${LMS_CORS_ORIGIN:-*}\"\n\n# Constructed base URL for helper functions\nexport LMS_API_BASE=\"http://${LMS_HOST}:${LMS_PORT}\"\n\n# === DATA DIRECTORIES ===\nexport LMS_LOG_DIR=\"$FLOX_ENV_CACHE/logs\"\nmkdir -p \"$LMS_LOG_DIR\"\n\n# === GPU DETECTION ===\nexport _FLOX_ENV_CUDA_DETECTION=0\nif command -v nvidia-smi >/dev/null 2>&1; then\n  if nvidia-smi -L 2>/dev/null | grep -q \"GPU\"; then\n    export _FLOX_ENV_CUDA_DETECTION=1\n  fi\nfi\n\n# === DISPLAY CONFIGURATION ===\necho \"\"\necho \"LM Studio + Agentic Tools environment ready\"\necho \"\"\necho \"Server:\"\necho \"  API: ${LMS_API_BASE}\"\necho \"  GUI: ${LMS_GUI}\"\nif [ \"$_FLOX_ENV_CUDA_DETECTION\" = \"1\" ]; then\n  echo \"  GPU: Available (CUDA detected)\"\nelse\n  echo \"  GPU: Not detected (CPU mode)\"\nfi\necho \"\"\necho \"Quick Start:\"\necho \"  flox activate -s                          Start LM Studio server\"\necho \"  lms get bartowski/Meta-Llama-3.1-8B-Instruct-GGUF\"\necho \"  lms load llama-3.1-8b-instruct            Load a model\"\necho \"  lms-launch claude                         Launch Claude Code\"\necho \"  lms-launch codex                          Launch Codex\"\necho \"  lms-launch opencode                       Launch OpenCode\"\necho \"\"\necho \"Commands:\"\necho \"  lms-launch <tool> [--model <m>] [args]    Launch agentic tool via LM Studio\"\necho \"  lms-models                                List loaded models\"\necho \"  lmstudio-info                             Show configuration\"\necho \"  lmstudio-health                           Test API endpoint\"\necho \"  helpf                                     View full README documentation\"\necho \"\"\n\n# Fetch README.md if not present\nREADME_FILE=\"$FLOX_ENV_PROJECT/README.md\"\nif [ ! -f \"$README_FILE\" ]; then\n  if curl -fsSL https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/agentic-lmstudio/README.md -o \"$README_FILE\" 2>/dev/null; then\n    echo \"Downloaded README.md (use 'helpf' to view)\"\n  fi\nfi\n"
    },
    "profile": {
      "bash": "lms-launch() {\n    if [ $# -eq 0 ]; then\n        echo \"Usage: lms-launch <tool> [--model <model>] [extra args...]\"\n        echo \"\"\n        echo \"Launch an agentic CLI tool connected to the local LM Studio server.\"\n        echo \"\"\n        echo \"Tools:\"\n        echo \"  claude      Claude Code (Anthropic CLI agent)\"\n        echo \"  codex       Codex (OpenAI CLI agent)\"\n        echo \"  opencode    OpenCode (open-source AI agent)\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --model <model>   Specify which loaded model to use\"\n        echo \"  Any additional arguments are passed through to the tool.\"\n        echo \"\"\n        echo \"Examples:\"\n        echo \"  lms-launch claude\"\n        echo \"  lms-launch claude --model llama-3.1-8b-instruct\"\n        echo \"  lms-launch codex\"\n        echo \"  lms-launch opencode\"\n        echo \"\"\n        echo \"The LM Studio server must be running (flox activate -s) with a model loaded.\"\n        return 0\n    fi\n\n    local tool=\"$1\"\n    shift\n\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n    local BASE=\"http://${HOST}:${PORT}\"\n\n    # Health check\n    if ! curl -sf \"${BASE}/v1/models\" >/dev/null 2>&1; then\n        echo \"Error: LM Studio API is not responding at ${BASE}\"\n        echo \"\"\n        echo \"Make sure the server is running:\"\n        echo \"  flox activate -s\"\n        echo \"\"\n        echo \"Check status:\"\n        echo \"  flox services status\"\n        echo \"  flox services logs lm-studio\"\n        return 1\n    fi\n\n    case \"$tool\" in\n        claude)\n            echo \"Launching Claude Code against LM Studio at ${BASE} ...\"\n            ANTHROPIC_API_BASE_URL=\"${BASE}\" \\\n            ANTHROPIC_API_KEY=\"lm-studio\" \\\n                claude \"$@\"\n            ;;\n        codex)\n            echo \"Launching Codex against LM Studio at ${BASE} ...\"\n            OPENAI_BASE_URL=\"${BASE}/v1\" \\\n            OPENAI_API_KEY=\"lm-studio\" \\\n                codex \"$@\"\n            ;;\n        opencode)\n            echo \"Launching OpenCode against LM Studio at ${BASE} ...\"\n            OPENAI_BASE_URL=\"${BASE}/v1\" \\\n            OPENAI_API_KEY=\"lm-studio\" \\\n                opencode \"$@\"\n            ;;\n        *)\n            echo \"Unknown tool: $tool\"\n            echo \"\"\n            echo \"Supported tools: claude, codex, opencode\"\n            echo \"Run 'lms-launch' without arguments for usage.\"\n            return 1\n            ;;\n    esac\n}\nexport -f lms-launch\n\nlms-models() {\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n    local BASE=\"http://${HOST}:${PORT}\"\n\n    if ! curl -sf \"${BASE}/v1/models\" >/dev/null 2>&1; then\n        echo \"LM Studio API is not responding at ${BASE}\"\n        echo \"  Try: flox services status\"\n        return 1\n    fi\n\n    echo \"Loaded models (${BASE}):\"\n    echo \"\"\n    curl -sf \"${BASE}/v1/models\" 2>/dev/null | jq -r '.data[] | \"  \\(.id)  (\\(.owned_by // \"unknown\"))\"' 2>/dev/null || \\\n        curl -sf \"${BASE}/v1/models\" 2>/dev/null\n}\nexport -f lms-models\n\nlmstudio-info() {\n    echo \"LM Studio + Agentic Tools Configuration\"\n    echo \"\"\n    echo \"Server:\"\n    echo \"  Host: ${LMS_HOST}\"\n    echo \"  Port: ${LMS_PORT}\"\n    echo \"  API:  http://${LMS_HOST}:${LMS_PORT}\"\n    echo \"  GUI:  ${LMS_GUI}\"\n    echo \"  CORS: ${LMS_CORS_ORIGIN}\"\n    echo \"\"\n    if [ \"$_FLOX_ENV_CUDA_DETECTION\" = \"1\" ]; then\n        echo \"GPU: Available (CUDA detected)\"\n    else\n        echo \"GPU: Not detected\"\n    fi\n    echo \"\"\n    echo \"Agentic Tools:\"\n    echo \"  lms-launch claude       Launch Claude Code via LM Studio\"\n    echo \"  lms-launch codex        Launch Codex via LM Studio\"\n    echo \"  lms-launch opencode     Launch OpenCode via LM Studio\"\n    echo \"\"\n    echo \"Model Management:\"\n    echo \"  lms get <model>         Download a model from Hugging Face\"\n    echo \"  lms load <model>        Load a model into memory\"\n    echo \"  lms-models              List loaded models via API\"\n    echo \"  lms chat                Interactive terminal chat\"\n    echo \"\"\n    echo \"Service Management:\"\n    echo \"  flox services status    Check service status\"\n    echo \"  flox services logs      View service logs\"\n    echo \"  lmstudio-health         Test API endpoint\"\n    echo \"\"\n    echo \"Logs: ${LMS_LOG_DIR}/lm-studio.log\"\n    echo \"\"\n    echo \"Runtime Override Examples:\"\n    echo \"  LMS_HOST=0.0.0.0 flox activate -s\"\n    echo \"  LMS_PORT=8080 flox activate -s\"\n    echo \"  LMS_GUI=true flox activate\"\n}\nexport -f lmstudio-info\n\nlmstudio-health() {\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n    local BASE=\"http://${HOST}:${PORT}\"\n\n    if curl -sf \"${BASE}/v1/models\" >/dev/null 2>&1; then\n        echo \"LM Studio API is healthy at ${BASE}\"\n        echo \"\"\n        echo \"Loaded models:\"\n        curl -sf \"${BASE}/v1/models\" 2>/dev/null | jq -r '.data[] | \"  \\(.id)\"' 2>/dev/null || \\\n            curl -sf \"${BASE}/v1/models\" 2>/dev/null\n        return 0\n    else\n        echo \"LM Studio API is not responding at ${BASE}\"\n        echo \"  Try: flox services status\"\n        echo \"  Logs: $LMS_LOG_DIR/lm-studio.log\"\n        return 1\n    fi\n}\nexport -f lmstudio-health\n\nhelpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/agentic-lmstudio/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    elif [ ! -f \"$README_FILE\" ]; then\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"README.md not found at $README_FILE\"\n        return 1\n    fi\n}\nexport -f helpf\n\n# Optionally launch GUI on activation\nif [ \"${LMS_GUI}\" = \"true\" ]; then\n    lm-studio &\nfi\n",
      "zsh": "lms-launch() {\n    if [ $# -eq 0 ]; then\n        echo \"Usage: lms-launch <tool> [--model <model>] [extra args...]\"\n        echo \"\"\n        echo \"Launch an agentic CLI tool connected to the local LM Studio server.\"\n        echo \"\"\n        echo \"Tools:\"\n        echo \"  claude      Claude Code (Anthropic CLI agent)\"\n        echo \"  codex       Codex (OpenAI CLI agent)\"\n        echo \"  opencode    OpenCode (open-source AI agent)\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --model <model>   Specify which loaded model to use\"\n        echo \"  Any additional arguments are passed through to the tool.\"\n        echo \"\"\n        echo \"Examples:\"\n        echo \"  lms-launch claude\"\n        echo \"  lms-launch claude --model llama-3.1-8b-instruct\"\n        echo \"  lms-launch codex\"\n        echo \"  lms-launch opencode\"\n        echo \"\"\n        echo \"The LM Studio server must be running (flox activate -s) with a model loaded.\"\n        return 0\n    fi\n\n    local tool=\"$1\"\n    shift\n\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n    local BASE=\"http://${HOST}:${PORT}\"\n\n    # Health check\n    if ! curl -sf \"${BASE}/v1/models\" >/dev/null 2>&1; then\n        echo \"Error: LM Studio API is not responding at ${BASE}\"\n        echo \"\"\n        echo \"Make sure the server is running:\"\n        echo \"  flox activate -s\"\n        echo \"\"\n        echo \"Check status:\"\n        echo \"  flox services status\"\n        echo \"  flox services logs lm-studio\"\n        return 1\n    fi\n\n    case \"$tool\" in\n        claude)\n            echo \"Launching Claude Code against LM Studio at ${BASE} ...\"\n            ANTHROPIC_API_BASE_URL=\"${BASE}\" \\\n            ANTHROPIC_API_KEY=\"lm-studio\" \\\n                claude \"$@\"\n            ;;\n        codex)\n            echo \"Launching Codex against LM Studio at ${BASE} ...\"\n            OPENAI_BASE_URL=\"${BASE}/v1\" \\\n            OPENAI_API_KEY=\"lm-studio\" \\\n                codex \"$@\"\n            ;;\n        opencode)\n            echo \"Launching OpenCode against LM Studio at ${BASE} ...\"\n            OPENAI_BASE_URL=\"${BASE}/v1\" \\\n            OPENAI_API_KEY=\"lm-studio\" \\\n                opencode \"$@\"\n            ;;\n        *)\n            echo \"Unknown tool: $tool\"\n            echo \"\"\n            echo \"Supported tools: claude, codex, opencode\"\n            echo \"Run 'lms-launch' without arguments for usage.\"\n            return 1\n            ;;\n    esac\n}\n\nlms-models() {\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n    local BASE=\"http://${HOST}:${PORT}\"\n\n    if ! curl -sf \"${BASE}/v1/models\" >/dev/null 2>&1; then\n        echo \"LM Studio API is not responding at ${BASE}\"\n        echo \"  Try: flox services status\"\n        return 1\n    fi\n\n    echo \"Loaded models (${BASE}):\"\n    echo \"\"\n    curl -sf \"${BASE}/v1/models\" 2>/dev/null | jq -r '.data[] | \"  \\(.id)  (\\(.owned_by // \"unknown\"))\"' 2>/dev/null || \\\n        curl -sf \"${BASE}/v1/models\" 2>/dev/null\n}\n\nlmstudio-info() {\n    echo \"LM Studio + Agentic Tools Configuration\"\n    echo \"\"\n    echo \"Server:\"\n    echo \"  Host: ${LMS_HOST}\"\n    echo \"  Port: ${LMS_PORT}\"\n    echo \"  API:  http://${LMS_HOST}:${LMS_PORT}\"\n    echo \"  GUI:  ${LMS_GUI}\"\n    echo \"  CORS: ${LMS_CORS_ORIGIN}\"\n    echo \"\"\n    if [ \"$_FLOX_ENV_CUDA_DETECTION\" = \"1\" ]; then\n        echo \"GPU: Available (CUDA detected)\"\n    else\n        echo \"GPU: Not detected\"\n    fi\n    echo \"\"\n    echo \"Agentic Tools:\"\n    echo \"  lms-launch claude       Launch Claude Code via LM Studio\"\n    echo \"  lms-launch codex        Launch Codex via LM Studio\"\n    echo \"  lms-launch opencode     Launch OpenCode via LM Studio\"\n    echo \"\"\n    echo \"Model Management:\"\n    echo \"  lms get <model>         Download a model from Hugging Face\"\n    echo \"  lms load <model>        Load a model into memory\"\n    echo \"  lms-models              List loaded models via API\"\n    echo \"  lms chat                Interactive terminal chat\"\n    echo \"\"\n    echo \"Service Management:\"\n    echo \"  flox services status    Check service status\"\n    echo \"  flox services logs      View service logs\"\n    echo \"  lmstudio-health         Test API endpoint\"\n    echo \"\"\n    echo \"Logs: ${LMS_LOG_DIR}/lm-studio.log\"\n    echo \"\"\n    echo \"Runtime Override Examples:\"\n    echo \"  LMS_HOST=0.0.0.0 flox activate -s\"\n    echo \"  LMS_PORT=8080 flox activate -s\"\n    echo \"  LMS_GUI=true flox activate\"\n}\n\nlmstudio-health() {\n    local HOST=\"${LMS_HOST:-127.0.0.1}\"\n    local PORT=\"${LMS_PORT:-1234}\"\n    local BASE=\"http://${HOST}:${PORT}\"\n\n    if curl -sf \"${BASE}/v1/models\" >/dev/null 2>&1; then\n        echo \"LM Studio API is healthy at ${BASE}\"\n        echo \"\"\n        echo \"Loaded models:\"\n        curl -sf \"${BASE}/v1/models\" 2>/dev/null | jq -r '.data[] | \"  \\(.id)\"' 2>/dev/null || \\\n            curl -sf \"${BASE}/v1/models\" 2>/dev/null\n        return 0\n    else\n        echo \"LM Studio API is not responding at ${BASE}\"\n        echo \"  Try: flox services status\"\n        echo \"  Logs: $LMS_LOG_DIR/lm-studio.log\"\n        return 1\n    fi\n}\n\nhelpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/agentic-lmstudio/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    elif [ ! -f \"$README_FILE\" ]; then\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"README.md not found at $README_FILE\"\n        return 1\n    fi\n}\n\n# Optionally launch GUI on activation\nif [ \"${LMS_GUI}\" = \"true\" ]; then\n    lm-studio &\nfi\n",
      "fish": "function lms-launch\n    if test (count $argv) -eq 0\n        echo \"Usage: lms-launch <tool> [--model <model>] [extra args...]\"\n        echo \"\"\n        echo \"Launch an agentic CLI tool connected to the local LM Studio server.\"\n        echo \"\"\n        echo \"Tools:\"\n        echo \"  claude      Claude Code (Anthropic CLI agent)\"\n        echo \"  codex       Codex (OpenAI CLI agent)\"\n        echo \"  opencode    OpenCode (open-source AI agent)\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --model <model>   Specify which loaded model to use\"\n        echo \"  Any additional arguments are passed through to the tool.\"\n        echo \"\"\n        echo \"Examples:\"\n        echo \"  lms-launch claude\"\n        echo \"  lms-launch claude --model llama-3.1-8b-instruct\"\n        echo \"  lms-launch codex\"\n        echo \"  lms-launch opencode\"\n        echo \"\"\n        echo \"The LM Studio server must be running (flox activate -s) with a model loaded.\"\n        return 0\n    end\n\n    set -l tool $argv[1]\n    set -e argv[1]\n\n    set -l HOST (test -n \"$LMS_HOST\"; and echo \"$LMS_HOST\"; or echo \"127.0.0.1\")\n    set -l PORT (test -n \"$LMS_PORT\"; and echo \"$LMS_PORT\"; or echo \"1234\")\n    set -l BASE \"http://$HOST:$PORT\"\n\n    # Health check\n    if not curl -sf \"$BASE/v1/models\" >/dev/null 2>&1\n        echo \"Error: LM Studio API is not responding at $BASE\"\n        echo \"\"\n        echo \"Make sure the server is running:\"\n        echo \"  flox activate -s\"\n        echo \"\"\n        echo \"Check status:\"\n        echo \"  flox services status\"\n        echo \"  flox services logs lm-studio\"\n        return 1\n    end\n\n    switch $tool\n        case claude\n            echo \"Launching Claude Code against LM Studio at $BASE ...\"\n            ANTHROPIC_API_BASE_URL=\"$BASE\" \\\n            ANTHROPIC_API_KEY=\"lm-studio\" \\\n                claude $argv\n        case codex\n            echo \"Launching Codex against LM Studio at $BASE ...\"\n            OPENAI_BASE_URL=\"$BASE/v1\" \\\n            OPENAI_API_KEY=\"lm-studio\" \\\n                codex $argv\n        case opencode\n            echo \"Launching OpenCode against LM Studio at $BASE ...\"\n            OPENAI_BASE_URL=\"$BASE/v1\" \\\n            OPENAI_API_KEY=\"lm-studio\" \\\n                opencode $argv\n        case '*'\n            echo \"Unknown tool: $tool\"\n            echo \"\"\n            echo \"Supported tools: claude, codex, opencode\"\n            echo \"Run 'lms-launch' without arguments for usage.\"\n            return 1\n    end\nend\n\nfunction lms-models\n    set -l HOST (test -n \"$LMS_HOST\"; and echo \"$LMS_HOST\"; or echo \"127.0.0.1\")\n    set -l PORT (test -n \"$LMS_PORT\"; and echo \"$LMS_PORT\"; or echo \"1234\")\n    set -l BASE \"http://$HOST:$PORT\"\n\n    if not curl -sf \"$BASE/v1/models\" >/dev/null 2>&1\n        echo \"LM Studio API is not responding at $BASE\"\n        echo \"  Try: flox services status\"\n        return 1\n    end\n\n    echo \"Loaded models ($BASE):\"\n    echo \"\"\n    curl -sf \"$BASE/v1/models\" 2>/dev/null | jq -r '.data[] | \"  \\(.id)  (\\(.owned_by // \"unknown\"))\"' 2>/dev/null; or \\\n        curl -sf \"$BASE/v1/models\" 2>/dev/null\nend\n\nfunction lmstudio-info\n    echo \"LM Studio + Agentic Tools Configuration\"\n    echo \"\"\n    echo \"Server:\"\n    echo \"  Host: $LMS_HOST\"\n    echo \"  Port: $LMS_PORT\"\n    echo \"  API:  http://$LMS_HOST:$LMS_PORT\"\n    echo \"  GUI:  $LMS_GUI\"\n    echo \"  CORS: $LMS_CORS_ORIGIN\"\n    echo \"\"\n    if test \"$_FLOX_ENV_CUDA_DETECTION\" = \"1\"\n        echo \"GPU: Available (CUDA detected)\"\n    else\n        echo \"GPU: Not detected\"\n    end\n    echo \"\"\n    echo \"Agentic Tools:\"\n    echo \"  lms-launch claude       Launch Claude Code via LM Studio\"\n    echo \"  lms-launch codex        Launch Codex via LM Studio\"\n    echo \"  lms-launch opencode     Launch OpenCode via LM Studio\"\n    echo \"\"\n    echo \"Model Management:\"\n    echo \"  lms get <model>         Download a model from Hugging Face\"\n    echo \"  lms load <model>        Load a model into memory\"\n    echo \"  lms-models              List loaded models via API\"\n    echo \"  lms chat                Interactive terminal chat\"\n    echo \"\"\n    echo \"Service Management:\"\n    echo \"  flox services status    Check service status\"\n    echo \"  flox services logs      View service logs\"\n    echo \"  lmstudio-health         Test API endpoint\"\n    echo \"\"\n    echo \"Logs: $LMS_LOG_DIR/lm-studio.log\"\n    echo \"\"\n    echo \"Runtime Override Examples:\"\n    echo \"  LMS_HOST=0.0.0.0 flox activate -s\"\n    echo \"  LMS_PORT=8080 flox activate -s\"\n    echo \"  LMS_GUI=true flox activate\"\nend\n\nfunction lmstudio-health\n    set -l HOST (test -n \"$LMS_HOST\"; and echo \"$LMS_HOST\"; or echo \"127.0.0.1\")\n    set -l PORT (test -n \"$LMS_PORT\"; and echo \"$LMS_PORT\"; or echo \"1234\")\n    set -l BASE \"http://$HOST:$PORT\"\n\n    if curl -sf \"$BASE/v1/models\" >/dev/null 2>&1\n        echo \"LM Studio API is healthy at $BASE\"\n        echo \"\"\n        echo \"Loaded models:\"\n        curl -sf \"$BASE/v1/models\" 2>/dev/null | jq -r '.data[] | \"  \\(.id)\"' 2>/dev/null; or \\\n            curl -sf \"$BASE/v1/models\" 2>/dev/null\n        return 0\n    else\n        echo \"LM Studio API is not responding at $BASE\"\n        echo \"  Try: flox services status\"\n        echo \"  Logs: $LMS_LOG_DIR/lm-studio.log\"\n        return 1\n    end\nend\n\nfunction helpf\n    set README_FILE \"$FLOX_ENV_PROJECT/README.md\"\n    set README_URL \"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/agentic-lmstudio/README.md\"\n\n    if test \"$argv[1]\" = \"--help\"\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    end\n\n    if test \"$argv[1]\" = \"--force\"\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        end\n    else if not test -f \"$README_FILE\"\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"Downloaded README.md\"\n        else\n            echo \"Failed to download README.md\"\n            return 1\n        end\n    end\n\n    if test -f \"$README_FILE\"\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"README.md not found at $README_FILE\"\n        return 1\n    end\nend\n\n# Optionally launch GUI on activation\nif test \"$LMS_GUI\" = \"true\"\n    lm-studio &\nend\n"
    },
