    "services": {
      "lm-studio": {
        "command": "# lms daemon up is the long-lived foreground process (LM Studio inference core).\n# Once it's ready, lms server start enables the HTTP API on top of it.\n# We background the daemon, wait for it, start the server, then wait on the daemon PID.\n\nlms daemon up >> \"$LMS_LOG_DIR/lm-studio.log\" 2>&1 &\nDAEMON_PID=$!\n\n# Wait for daemon to become ready\nfor i in $(seq 1 30); do\n  if lms status >/dev/null 2>&1; then\n    break\n  fi\n  sleep 1\ndone\n\nif ! lms status >/dev/null 2>&1; then\n  echo \"ERROR: LM Studio daemon failed to start after 30s\" >&2\n  echo \"Check logs: $LMS_LOG_DIR/lm-studio.log\" >&2\n  exit 1\nfi\n\n# Enable the API server\nlms server start --port \"$LMS_PORT\" --host \"$LMS_HOST\" --cors-origin \"$LMS_CORS_ORIGIN\" >> \"$LMS_LOG_DIR/lm-studio.log\" 2>&1\n\necho \"LM Studio daemon + API server running on http://${LMS_HOST}:${LMS_PORT}\"\n\n# Keep the service alive by waiting on the daemon process\nwait $DAEMON_PID\n",
        "is-daemon": false
      }
    }
