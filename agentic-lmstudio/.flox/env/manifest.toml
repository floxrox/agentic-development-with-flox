fish = '''
function lms-launch
    if test (count $argv) -eq 0
        echo "Usage: lms-launch <tool> --model <model> [extra args...]"
        echo ""
        echo "Launch an agentic CLI tool connected to the local LM Studio server."
        echo ""
        echo "Tools:"
        echo "  claude      Claude Code (Anthropic CLI agent)"
        echo "  codex       Codex (OpenAI CLI agent)"
        echo "  opencode    OpenCode (open-source AI agent)"
        echo ""
        echo "Options:"
        echo "  --model <model>   Model to use (REQUIRED — without this, tools"
        echo "                    default to their cloud provider, not LM Studio)"
        echo "  Any additional arguments are passed through to the tool."
        echo ""
        echo "Examples:"
        echo "  lms-launch claude --model google/gemma-4-e4b"
        echo "  lms-launch codex --model google/gemma-4-e4b"
        echo "  lms-launch opencode --model google/gemma-4-e4b"
        echo ""
        echo "The LM Studio server must be running (flox activate -s) with a model loaded."
        echo "Use 'lms-models' to see which models are currently loaded."
        return 0
    end

    set -l tool $argv[1]
    set -e argv[1]

    set -l HOST (test -n "$LMS_HOST"; and echo "$LMS_HOST"; or echo "127.0.0.1")
    set -l PORT (test -n "$LMS_PORT"; and echo "$LMS_PORT"; or echo "1234")
    set -l BASE "http://$HOST:$PORT"

    # Health check
    if not curl -sf "$BASE/v1/models" >/dev/null 2>&1
        echo "Error: LM Studio API is not responding at $BASE"
        echo ""
        echo "Make sure the server is running:"
        echo "  flox activate -s"
        echo ""
        echo "Check status:"
        echo "  flox services status"
        echo "  flox services logs lm-studio"
        return 1
    end

    switch $tool
        case claude
            echo "Launching Claude Code against LM Studio at $BASE ..."
            ANTHROPIC_BASE_URL="$BASE" \
            ANTHROPIC_AUTH_TOKEN="lmstudio" \
            ANTHROPIC_API_KEY="" \
                claude $argv
        case codex
            echo "Launching Codex against LM Studio at $BASE ..."
            OPENAI_BASE_URL="$BASE/v1" \
            OPENAI_API_KEY="lm-studio" \
                codex $argv
        case opencode
            echo "Launching OpenCode against LM Studio at $BASE ..."
            OPENAI_BASE_URL="$BASE/v1" \
            OPENAI_API_KEY="lm-studio" \
                opencode $argv
        case '*'
            echo "Unknown tool: $tool"
            echo ""
            echo "Supported tools: claude, codex, opencode"
            echo "Run 'lms-launch' without arguments for usage."
            return 1
    end
end

function lmstudio-info
    echo "LM Studio + Agentic Tools Configuration"
    echo ""
    echo "Server:"
    echo "  Host: $LMS_HOST"
    echo "  Port: $LMS_PORT"
    echo "  API:  http://$LMS_HOST:$LMS_PORT"
    echo "  GUI:  $LMS_GUI"
    echo "  CORS: $LMS_CORS_ORIGIN"
    echo ""
    if test "$_FLOX_ENV_CUDA_DETECTION" = "1"
        echo "GPU: Available (CUDA detected)"
    else
        echo "GPU: Not detected"
    end
    echo ""
    echo "Agentic Tools:"
    echo "  lms-launch claude --model <m>   Launch Claude Code (local model)"
    echo "  lms-launch codex --model <m>    Launch Codex (local model)"
    echo "  lms-launch opencode --model <m> Launch OpenCode (local model)"
    echo ""
    echo "  NOTE: --model is required — without it, tools use their cloud provider."
    echo ""
    echo "Model Management:"
    echo "  lms get <model>                 Download a model from Hugging Face"
    echo "  lms load <model> --context-length 65536"
    echo "                                  Load model with context window"
    echo "  lms-models                      List loaded models via API"
    echo "  lms chat                        Interactive terminal chat"
    echo ""
    echo "Service Management:"
    echo "  flox services status            Check service status"
    echo "  flox services logs              View service logs"
    echo "  lmstudio-health                 Test API endpoint"
    echo ""
    echo "Logs: $LMS_LOG_DIR/lm-studio.log"
    echo ""
    echo "Runtime Override Examples:"
    echo "  LMS_HOST=0.0.0.0 flox activate -s"
    echo "  LMS_PORT=8080 flox activate -s"
    echo "  LMS_GUI=true flox activate"
end

function helpf
    set README_FILE "$FLOX_ENV_PROJECT/README.md"
    set README_URL "https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/agentic-lmstudio/README.md"

    if test "$argv[1]" = "--help"
        echo "Usage: helpf [OPTIONS]"
