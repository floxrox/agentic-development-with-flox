fish = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if set -q AGENTIC_LMSTUDIO_SHIM_DIR; and test -x "$AGENTIC_LMSTUDIO_SHIM_DIR/claude"
    set -gx PATH $AGENTIC_LMSTUDIO_SHIM_DIR (string match -v -- $AGENTIC_LMSTUDIO_SHIM_DIR $PATH)
end

# Wait for API server if services are starting
if test "$FLOX_ACTIVATE_START_SERVICES" = "true"
  printf "Waiting for LM Studio API"
  set _lms_ready false
  for _i in (seq 1 30)
    if curl -sf "http://$LMS_HOST:$LMS_PORT/v1/models" >/dev/null 2>&1
      set _lms_ready true
      break
    end
    printf "."
    sleep 2
  end
  if test "$_lms_ready" = "true"
    echo " ready!"
  else
    echo " not responding (check: flox services logs lm-studio)"
  end
end

function helpf
    set README_FILE "$FLOX_ENV_PROJECT/README.md"
    set README_URL "https://raw.githubusercontent.com/floxrox/agentic-development-with-flox/main/agentic-lmstudio/README.md"

    if test "$argv[1]" = "--help"
        echo "Usage: helpf [OPTIONS]"
        echo ""
        echo "View environment documentation"
        echo ""
        echo "Options:"
        echo "  --force    Force download fresh copy from GitHub"
        echo "  --help     Show this help message"
        echo ""
        echo "The README is cached locally and only downloaded if missing."
        return 0
    end

    if test "$argv[1]" = "--force"
        echo "Fetching latest README.md from GitHub..."
        if curl -fsSL "$README_URL" -o "$README_FILE"
            echo "Downloaded README.md"
        else
            echo "Failed to download README.md"
            return 1
        end
    else if not test -f "$README_FILE"
        echo "README.md not found, downloading..."
        if curl -fsSL "$README_URL" -o "$README_FILE"
            echo "Downloaded README.md"
        else
            echo "Failed to download README.md"
            return 1
        end
    end

    if test -f "$README_FILE"
        bat --style=auto --paging=always "$README_FILE"
    else
        echo "README.md not found at $README_FILE"
        return 1
    end
end

# Optionally launch GUI on activation
if test "$LMS_GUI" = "true"
    lm-studio &
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
