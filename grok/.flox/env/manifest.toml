schema-version = "1.11.0"

[install]
grok.pkg-path = "flox/grok"
grok.pkg-group = "grok"

# Flox skills (flox, floxify, flox-debug) - teach Grok to manage Flox environments
skills-flox.pkg-path = "flox/skills-flox"
skills-flox.pkg-group = "flox-skills"

git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[vars]
# API key - set in your shell profile or pass at activation time
# XAI_API_KEY = ""

# Or run 'grok login' to sign in with your xAI account

[hook]
on-activate = '''
# The flox/grok Linux entry points run Grok under bubblewrap with a tmpfs over
# /bin, so that Grok's hardcoded /bin/bash works on NixOS. On distributions
# where /bin is a symlink to usr/bin (Debian, Ubuntu, Fedora, Arch, ...)
# bubblewrap refuses that mount ("Can't mount on symlink destination /bin")
# and Grok never starts. Those systems already have /bin/bash, so the shims
# below run the Grok launchers directly there; NixOS keeps the bubblewrap path.
setup_grok_launchers() {
    local real_grok shim_dir pkg_dir name
    [ "$(uname -s)" = "Linux" ] || return 0
    [ -x /bin/bash ] || return 0
    real_grok=$(readlink -f "$FLOX_ENV/bin/grok") || return 0
    pkg_dir=$(dirname "$(dirname "$real_grok")")
    shim_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$shim_dir"
    for name in grok agent; do
        [ -x "$pkg_dir/libexec/grok/$name-launcher" ] || continue
        # Write to a temporary file and rename, so a grok starting in another
        # shell at the same moment never runs a half-written shim
        printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$pkg_dir/libexec/grok/$name-launcher" > "$shim_dir/.$name.$$"
        chmod +x "$shim_dir/.$name.$$"
        mv -f "$shim_dir/.$name.$$" "$shim_dir/$name"
    done
    case ":$PATH:" in *":$shim_dir:"*) ;; *) export PATH="$shim_dir:$PATH" ;; esac
}

# Link the Flox skills into ~/.grok/skills. Grok reads extra skill paths only
# from ~/.grok/config.toml, not from its environment overlays, so linking is
# the environment-scoped option. Links that point at a Flox skills package are
# refreshed on each activation; skills you added yourself (directories, or
# symlinks pointing anywhere else) are never replaced.
link_grok_flox_skills() {
    local skills_src="$FLOX_ENV/share/flox/codex/flox"
    local skills_dst="${GROK_HOME:-$HOME/.grok}/skills"
    local skill name target
    [ -d "$skills_src" ] || return 0
    mkdir -p "$skills_dst"
    for skill in "$skills_src"/*/; do
        name=$(basename "$skill")
        target="$skills_dst/$name"
        if [ -L "$target" ]; then
            case "$(readlink "$target")" in
                */share/flox/codex/flox/"$name") ;;
                *) continue ;;
            esac
        elif [ -e "$target" ]; then
            continue
        fi
        ln -sfn "$skills_src/$name" "$target"
    done
}

setup_grok_launchers
link_grok_flox_skills

# === DISPLAY CONFIGURATION ===
echo ""
echo "Grok Build environment ready"
echo ""

if [ -n "$XAI_API_KEY" ]; then
  echo "  xAI API key: set"
else
  echo "  xAI API key: not set"
  echo ""
  echo "  Set an API key or sign in:"
  echo "    export XAI_API_KEY=xai-..."
  echo "    grok login"
fi
echo ""

echo "Commands:"
echo "  grok                         Start interactive TUI"
echo "  grok \"<prompt>\"              Start with an initial prompt"
echo "  grok -p \"<prompt>\"           Single-turn prompt, then exit"
echo "  grok inspect                 Show discovered config, skills, and rules"
echo "  grok-info                    Show configuration"
echo ""
echo "Flox skills: flox, floxify, and flox-debug linked into ~/.grok/skills"
echo ""
'''

[profile]
bash = '''
grok-info() {
    echo "Grok Build Environment Configuration"
    echo ""
    echo "API Key:"
    [ -n "$XAI_API_KEY" ] && echo "  xAI: set" || echo "  xAI: not set (or use 'grok login')"
    echo ""
    echo "Flox skills: ${GROK_HOME:-$HOME/.grok}/skills"
    echo ""
    echo "Commands:"
    echo "  grok                         Start interactive TUI"
    echo "  grok \"<prompt>\"              Start with an initial prompt"
    echo "  grok -p \"<prompt>\"           Single-turn prompt, then exit"
    echo "  grok inspect                 Show discovered config, skills, and rules"
    echo "  grok login | logout          Manage your xAI sign-in"
    echo ""
    echo "Config: ${GROK_HOME:-$HOME/.grok}/config.toml"
    echo "Source: https://x.ai"
}
export -f grok-info
'''

zsh = '''
grok-info() {
    echo "Grok Build Environment Configuration"
    echo ""
    echo "API Key:"
    [ -n "$XAI_API_KEY" ] && echo "  xAI: set" || echo "  xAI: not set (or use 'grok login')"
    echo ""
    echo "Flox skills: ${GROK_HOME:-$HOME/.grok}/skills"
    echo ""
    echo "Commands:"
    echo "  grok                         Start interactive TUI"
    echo "  grok \"<prompt>\"              Start with an initial prompt"
    echo "  grok -p \"<prompt>\"           Single-turn prompt, then exit"
    echo "  grok inspect                 Show discovered config, skills, and rules"
    echo "  grok login | logout          Manage your xAI sign-in"
    echo ""
    echo "Config: ${GROK_HOME:-$HOME/.grok}/config.toml"
    echo "Source: https://x.ai"
}
'''

fish = '''
function grok-info
    set -l grok_home $HOME/.grok
    if set -q GROK_HOME; set grok_home $GROK_HOME; end
    echo "Grok Build Environment Configuration"
    echo ""
    echo "API Key:"
    if test -n "$XAI_API_KEY"; echo "  xAI: set"; else; echo "  xAI: not set (or use 'grok login')"; end
    echo ""
    echo "Flox skills: $grok_home/skills"
    echo ""
    echo "Commands:"
    echo "  grok                         Start interactive TUI"
    echo "  grok \"<prompt>\"              Start with an initial prompt"
    echo "  grok -p \"<prompt>\"           Single-turn prompt, then exit"
    echo "  grok inspect                 Show discovered config, skills, and rules"
    echo "  grok login | logout          Manage your xAI sign-in"
    echo ""
    echo "Config: $grok_home/config.toml"
    echo "Source: https://x.ai"
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
