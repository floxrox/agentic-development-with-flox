    "hook": {
      "on-activate": "echo \"\"\necho \"Google Antigravity environment ready\"\necho \"\"\necho \"Commands:\"\necho \"  antigravity                Open Antigravity IDE\"\necho \"  antigravity <dir>          Open a project directory\"\necho \"  antigravity-info           Show configuration\"\necho \"\"\necho \"First run:\"\necho \"  Sign in with your Google Account when prompted.\"\necho \"  Gemini models are available immediately on the free tier.\"\necho \"\"\n"
    },
    "profile": {
      "bash": "antigravity-info() {\n    echo \"Google Antigravity Environment\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  antigravity                Open Antigravity IDE\"\n    echo \"  antigravity <dir>          Open a project directory\"\n    echo \"  antigravity --help         Show CLI options\"\n    echo \"\"\n    echo \"IDE Shortcuts:\"\n    echo \"  Cmd/Ctrl+I       Inline AI command\"\n    echo \"  Manager View     Spawn and monitor parallel agents\"\n    echo \"\"\n    echo \"Agent Configuration:\"\n    echo \"  agents.md         Project-level agent instructions\"\n    echo \"  skills.md         Reusable agent skills\"\n    echo \"\"\n    echo \"Supported Models:\"\n    echo \"  Gemini 3.1 Pro, Gemini 3 Flash\"\n    echo \"  Claude Sonnet 4.6, Claude Opus 4.6\"\n    echo \"\"\n    echo \"Account: Sign in at antigravity.google\"\n    echo \"Docs:    https://antigravity.google/docs\"\n}\nexport -f antigravity-info\n",
      "zsh": "antigravity-info() {\n    echo \"Google Antigravity Environment\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  antigravity                Open Antigravity IDE\"\n    echo \"  antigravity <dir>          Open a project directory\"\n    echo \"  antigravity --help         Show CLI options\"\n    echo \"\"\n    echo \"IDE Shortcuts:\"\n    echo \"  Cmd/Ctrl+I       Inline AI command\"\n    echo \"  Manager View     Spawn and monitor parallel agents\"\n    echo \"\"\n    echo \"Agent Configuration:\"\n    echo \"  agents.md         Project-level agent instructions\"\n    echo \"  skills.md         Reusable agent skills\"\n    echo \"\"\n    echo \"Supported Models:\"\n    echo \"  Gemini 3.1 Pro, Gemini 3 Flash\"\n    echo \"  Claude Sonnet 4.6, Claude Opus 4.6\"\n    echo \"\"\n    echo \"Account: Sign in at antigravity.google\"\n    echo \"Docs:    https://antigravity.google/docs\"\n}\n",
      "fish": "function antigravity-info\n    echo \"Google Antigravity Environment\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  antigravity                Open Antigravity IDE\"\n    echo \"  antigravity <dir>          Open a project directory\"\n    echo \"  antigravity --help         Show CLI options\"\n    echo \"\"\n    echo \"IDE Shortcuts:\"\n    echo \"  Cmd/Ctrl+I       Inline AI command\"\n    echo \"  Manager View     Spawn and monitor parallel agents\"\n    echo \"\"\n    echo \"Agent Configuration:\"\n    echo \"  agents.md         Project-level agent instructions\"\n    echo \"  skills.md         Reusable agent skills\"\n    echo \"\"\n    echo \"Supported Models:\"\n    echo \"  Gemini 3.1 Pro, Gemini 3 Flash\"\n    echo \"  Claude Sonnet 4.6, Claude Opus 4.6\"\n    echo \"\"\n    echo \"Account: Sign in at antigravity.google\"\n    echo \"Docs:    https://antigravity.google/docs\"\nend\n"
    },
