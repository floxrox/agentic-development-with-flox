fish = '''
function basic-memory-info
    set -l notes $HOME/basic-memory
    if set -q BASIC_MEMORY_HOME; and test -n "$BASIC_MEMORY_HOME"; set notes $BASIC_MEMORY_HOME; end
    set -l config $HOME/.basic-memory
    if set -q XDG_CONFIG_HOME; and test -n "$XDG_CONFIG_HOME"; set config $XDG_CONFIG_HOME/basic-memory; end
    if set -q BASIC_MEMORY_CONFIG_DIR; and test -n "$BASIC_MEMORY_CONFIG_DIR"; set config $BASIC_MEMORY_CONFIG_DIR; end
    echo "Basic Memory Environment Configuration"
    echo ""
    echo "MCP launcher: $FLOX_ENV_CACHE/bin/basic-memory-mcp"
    echo "Notes (first project): $notes"
    echo "Config and index: $config"
    # Basic Memory treats 1, true, and yes (any case) as off
    if contains -- (string lower -- (string trim -- "$BASIC_MEMORY_NO_PROMOS")) 1 true yes
        echo "Cloud promos and analytics: off"
    else
        echo "Cloud promos and analytics: on"
    end
    echo ""
    echo "Commands:"
    echo "  basic-memory-register claude-code  Register with Claude Code (also: codex)"
    echo "  basic-memory-register print        Show the command for any other MCP client"
    echo "  bm project list                    List projects"
    echo "  bm project add <name> <path>       Add a project"
    echo "  bm project default <name>          Set the default project"
    echo "  bm tool search-notes <query>       Search notes from the shell"
    echo "  bm doctor                          Check files against the index"
    echo ""
    echo "Source: https://github.com/basicmachines-co/basic-memory"
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
