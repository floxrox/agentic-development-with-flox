# Uncomment to compose with a local inference backend.
# After uncommenting, run: flox activate -s
# Then use: aider --model ollama_chat/<model>
[include]
# environments = [
#   { remote = "flox/ollama" },
# ]

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-darwin",
  "x86_64-linux",
]
