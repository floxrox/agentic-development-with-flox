schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
gemini-cli.pkg-path = "gemini-cli"
gemini-cli-vscode-ide-companion.pkg-path = "vscode-extensions.Google.gemini-cli-vscode-ide-companion"
jq.pkg-path = "jq"
jq.outputs = "all"

# Flox skills (flox, floxify, flox-debug) - teach Gemini CLI to manage Flox environments
skills-flox.pkg-path = "flox/skills-flox"
skills-flox.pkg-group = "flox-skills"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]


## Activation Hook ---------------------------------------------------
[hook]
on-activate = '''
# Link the Flox skills into ~/.gemini/skills (Gemini CLI has no
# environment-scoped skill path). Links that point at a Flox skills package are
# refreshed on each activation; skills you added yourself (directories, or
# symlinks pointing anywhere else) are never replaced.
link_gemini_flox_skills() {
    local skills_src="$FLOX_ENV/share/flox/codex/flox"
    local skills_dst="$HOME/.gemini/skills"
    local skill name target
    [ -d "$skills_src" ] || return 0
    mkdir -p "$skills_dst"
    for skill in "$skills_src"/*/; do
        name=$(basename "$skill")
        target="$skills_dst/$name"
        if [ -L "$target" ]; then
            case "$(readlink "$target")" in
                */share/flox/codex/flox/"$name") ;;
                *) continue ;;
            esac
        elif [ -e "$target" ]; then
            continue
        fi
        ln -sfn "$skills_src/$name" "$target"
    done
}

# Remove the deprecated "flox" MCP server added to ~/.gemini/settings.json
# by earlier versions of this environment
remove_gemini_flox_mcp() {
    local settings_file="$HOME/.gemini/settings.json"
    local tmp
    jq -e '.mcpServers.flox.command == "flox-mcp"' "$settings_file" >/dev/null 2>&1 || return 0
    tmp=$(mktemp)
    if jq 'del(.mcpServers.flox)' "$settings_file" > "$tmp"; then
        cat "$tmp" > "$settings_file"
        echo "Removed deprecated Flox MCP server from ~/.gemini/settings.json (replaced by Flox skills)"
    fi
    rm -f "$tmp"
}

link_gemini_flox_skills
remove_gemini_flox_mcp

echo ""
echo "Gemini CLI - AI Agent in Your Terminal"
echo ""
echo "An open-source AI agent from Google bringing Gemini to your terminal."
echo ""
echo "First-time setup:"
echo "  gemini                      # Launch interactive session"
echo "                              # Authenticate on first run (OAuth, API key, or Vertex AI)"
echo ""
echo "Usage:"
echo "  gemini                      # Interactive mode"
echo "  gemini -p \"prompt\"          # Non-interactive mode"
echo "  gemini --output-format json # JSON output for scripting"
echo "  gemini -m gemini-2.5-flash  # Specify model"
echo ""
echo "Flox skills:"
echo "  flox, floxify, and flox-debug linked into ~/.gemini/skills"
echo "  /skills list                # Verify inside a Gemini session"
echo ""
echo "Optional enhancements:"
echo "  GEMINI.md                   # Project context file (see README)"
echo ""
echo "VS Code extension installed and ready to use!"
echo ""
echo "Open Source • Apache-2.0 License"
echo ""
'''


