'''

fish = '''
function pi-info
    echo "pi Environment Configuration"
    echo ""
    echo "API Keys:"
    if test -n "$ANTHROPIC_API_KEY"; echo "  Anthropic: set"; else; echo "  Anthropic: not set"; end
    if test -n "$OPENAI_API_KEY"; echo "  OpenAI: set"; else; echo "  OpenAI: not set"; end
    if test -n "$GEMINI_API_KEY"; echo "  Gemini: set"; else; echo "  Gemini: not set"; end
    if test -n "$OPENROUTER_API_KEY"; echo "  OpenRouter: set"; else; echo "  OpenRouter: not set"; end
    echo ""
    echo "Flox skills: $FLOX_ENV/share/flox/codex/flox"
    echo ""
    echo "Commands:"
    echo "  pi                           Start interactive session"
    echo "  pi -p \"<prompt>\"             Non-interactive single prompt"
    echo "  pi -c                        Continue previous session"
    echo "  pi install <source>          Install an extension or Pi package"
    echo ""
    echo "Config: ~/.pi/agent (override with PI_CODING_AGENT_DIR)"
    echo "Source: https://github.com/earendil-works/pi"
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
