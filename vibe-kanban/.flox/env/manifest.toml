    echo "  vibe-kanban                  Run in the foreground (random port, opens browser)"
    echo "  vibe-kanban-mcp --mode global  MCP server for managing tasks from an agent"
    echo ""
    echo "Data: ~/.local/share/vibe-kanban (Linux), ~/Library/Application Support (macOS)"
