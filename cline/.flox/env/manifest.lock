    "hook": {
      "on-activate": "# === CLINE INSTALLATION ===\nexport NPM_GLOBAL_DIR=\"$FLOX_ENV_CACHE/npm-global\"\nexport PATH=\"$NPM_GLOBAL_DIR/bin:$PATH\"\n\n# Install cline globally if not present or outdated\nif ! command -v cline >/dev/null 2>&1; then\n  echo \"Installing cline CLI...\"\n  npm install -g --prefix \"$NPM_GLOBAL_DIR\" cline 2>/dev/null\n  echo \"\"\nfi\n\n# === DISPLAY CONFIGURATION ===\necho \"\"\necho \"Cline environment ready\"\necho \"\"\n\n# Show API key status\n_has_key=0\nif [ -n \"$ANTHROPIC_API_KEY\" ]; then\n  echo \"  Anthropic API key: set\"\n  _has_key=1\nelse\n  echo \"  Anthropic API key: not set\"\nfi\nif [ -n \"$OPENAI_API_KEY\" ]; then\n  echo \"  OpenAI API key: set\"\n  _has_key=1\nelse\n  echo \"  OpenAI API key: not set\"\nfi\necho \"\"\n\nif [ \"$_has_key\" = \"0\" ]; then\n  echo \"  Configure a provider:\"\n  echo \"    cline auth\"\n  echo \"    cline auth -p anthropic -k sk-ant-...\"\n  echo \"\"\nfi\n\necho \"Commands:\"\necho \"  cline \\\"<prompt>\\\"             Run an agent task\"\necho \"  cline -m ask \\\"<prompt>\\\"      Ask without editing\"\necho \"  cline auth                   Configure provider/API key\"\necho \"  cline config                 View/edit configuration\"\necho \"  cline -acp                   ACP mode (Zed, Neovim, JetBrains)\"\necho \"  cline-info                   Show configuration\"\necho \"\"\necho \"Examples:\"\necho \"  cline \\\"Add unit tests for the auth module\\\"\"\necho \"  cline -y \\\"Fix all linting errors\\\"    # Auto-approve (headless)\"\necho \"  cline --json \\\"Refactor utils\\\"        # NDJSON output for scripting\"\necho \"\"\n\nunset _has_key\n"
    },
    "profile": {
      "bash": "export PATH=\"$FLOX_ENV_CACHE/npm-global/bin:$PATH\"\n\ncline-info() {\n    echo \"Cline Environment Configuration\"\n    echo \"\"\n    echo \"API Keys:\"\n    [ -n \"$ANTHROPIC_API_KEY\" ] && echo \"  Anthropic: set\" || echo \"  Anthropic: not set\"\n    [ -n \"$OPENAI_API_KEY\" ] && echo \"  OpenAI: set\" || echo \"  OpenAI: not set\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  cline \\\"<prompt>\\\"             Run agent task\"\n    echo \"  cline -m ask \\\"<prompt>\\\"      Ask mode (no edits)\"\n    echo \"  cline -m edit \\\"<prompt>\\\"     Edit mode\"\n    echo \"  cline -y \\\"<prompt>\\\"          Auto-approve (headless/CI)\"\n    echo \"  cline --json \\\"<prompt>\\\"      NDJSON output for scripting\"\n    echo \"  cline auth                   Configure provider/API key\"\n    echo \"  cline config                 View/edit configuration\"\n    echo \"  cline -acp                   ACP mode (editor integration)\"\n    echo \"\"\n    echo \"Providers:\"\n    echo \"  Anthropic, OpenAI, Google Gemini, OpenRouter, AWS Bedrock,\"\n    echo \"  Azure OpenAI, DeepSeek, Ollama, LM Studio, and more\"\n    echo \"\"\n    echo \"Update cline:\"\n    echo \"  npm install -g --prefix \\\"\\$FLOX_ENV_CACHE/npm-global\\\" cline\"\n}\nexport -f cline-info\n",
      "zsh": "export PATH=\"$FLOX_ENV_CACHE/npm-global/bin:$PATH\"\n\ncline-info() {\n    echo \"Cline Environment Configuration\"\n    echo \"\"\n    echo \"API Keys:\"\n    [ -n \"$ANTHROPIC_API_KEY\" ] && echo \"  Anthropic: set\" || echo \"  Anthropic: not set\"\n    [ -n \"$OPENAI_API_KEY\" ] && echo \"  OpenAI: set\" || echo \"  OpenAI: not set\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  cline \\\"<prompt>\\\"             Run agent task\"\n    echo \"  cline -m ask \\\"<prompt>\\\"      Ask mode (no edits)\"\n    echo \"  cline -m edit \\\"<prompt>\\\"     Edit mode\"\n    echo \"  cline -y \\\"<prompt>\\\"          Auto-approve (headless/CI)\"\n    echo \"  cline --json \\\"<prompt>\\\"      NDJSON output for scripting\"\n    echo \"  cline auth                   Configure provider/API key\"\n    echo \"  cline config                 View/edit configuration\"\n    echo \"  cline -acp                   ACP mode (editor integration)\"\n    echo \"\"\n    echo \"Providers:\"\n    echo \"  Anthropic, OpenAI, Google Gemini, OpenRouter, AWS Bedrock,\"\n    echo \"  Azure OpenAI, DeepSeek, Ollama, LM Studio, and more\"\n    echo \"\"\n    echo \"Update cline:\"\n    echo \"  npm install -g --prefix \\\"\\$FLOX_ENV_CACHE/npm-global\\\" cline\"\n}\n",
      "fish": "set -gx PATH \"$FLOX_ENV_CACHE/npm-global/bin\" $PATH\n\nfunction cline-info\n    echo \"Cline Environment Configuration\"\n    echo \"\"\n    echo \"API Keys:\"\n    if test -n \"$ANTHROPIC_API_KEY\"\n        echo \"  Anthropic: set\"\n    else\n        echo \"  Anthropic: not set\"\n    end\n    if test -n \"$OPENAI_API_KEY\"\n        echo \"  OpenAI: set\"\n    else\n        echo \"  OpenAI: not set\"\n    end\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  cline \\\"<prompt>\\\"             Run agent task\"\n    echo \"  cline -m ask \\\"<prompt>\\\"      Ask mode (no edits)\"\n    echo \"  cline -m edit \\\"<prompt>\\\"     Edit mode\"\n    echo \"  cline -y \\\"<prompt>\\\"          Auto-approve (headless/CI)\"\n    echo \"  cline --json \\\"<prompt>\\\"      NDJSON output for scripting\"\n    echo \"  cline auth                   Configure provider/API key\"\n    echo \"  cline config                 View/edit configuration\"\n    echo \"  cline -acp                   ACP mode (editor integration)\"\n    echo \"\"\n    echo \"Providers:\"\n    echo \"  Anthropic, OpenAI, Google Gemini, OpenRouter, AWS Bedrock,\"\n    echo \"  Azure OpenAI, DeepSeek, Ollama, LM Studio, and more\"\n    echo \"\"\n    echo \"Update cline:\"\n    echo \"  npm install -g --prefix \\\"\\$FLOX_ENV_CACHE/npm-global\\\" cline\"\nend\n"
    },
