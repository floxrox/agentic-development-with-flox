{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.11.0",
    "install": {
      "openclaw": {
        "flake": "github:barstoolbluz/openclaw-nix"
      }
    },
    "vars": {
      "NODE_OPTIONS": "--no-deprecation"
    },
    "hook": {
      "on-activate": "# Point OpenClaw config/state at the Flox environment cache (not $HOME)\nexport OPENCLAW_CONFIG_PATH=\"$FLOX_ENV_CACHE/openclaw/openclaw.json\"\nexport OPENCLAW_STATE_DIR=\"$FLOX_ENV_CACHE/openclaw\"\n\n# Bootstrap minimal config on first activation; pass RESET=1 flox activate to regenerate\nmkdir -p \"$(dirname \"$OPENCLAW_CONFIG_PATH\")\"\nif [ ! -f \"$OPENCLAW_CONFIG_PATH\" ] || [ \"${RESET:-0}\" = \"1\" ]; then\n    cat > \"$OPENCLAW_CONFIG_PATH\" << 'EOF'\n{\n  \"gateway\": {\n    \"mode\": \"local\"\n  }\n}\nEOF\nfi\n\necho \"\"\necho \"OpenClaw - Self-hosted, Open-source AI Assistant/Agent\"\necho \"\"\necho \"First-time setup:\"\necho \"  openclaw onboard              # Interactive onboarding wizard\"\necho \"  openclaw configure            # Setup credentials and channels\"\necho \"\"\necho \"Usage:\"\necho \"  flox activate -s              # Start the Gateway as a Flox service\"\necho \"  openclaw tui                  # Terminal UI connected to Gateway\"\necho \"  openclaw agent --message \\\"..\\\" # Run one agent turn\"\necho \"  openclaw doctor               # Health checks and quick fixes\"\necho \"  openclaw --help               # Show all commands\"\necho \"\"\n"
    },
    "profile": {
      "bash": "# Helper: Edit OpenClaw configuration\nopenclaw-config() {\n    \"${EDITOR:-nano}\" \"$OPENCLAW_CONFIG_PATH\"\n}\n\nexport -f openclaw-config\n",
      "zsh": "# Helper: Edit OpenClaw configuration\nopenclaw-config() {\n    \"${EDITOR:-nano}\" \"$OPENCLAW_CONFIG_PATH\"\n}\n"
    },
    "options": {},
    "services": {
      "gateway": {
        "command": "openclaw gateway"
      }
    }
  },
