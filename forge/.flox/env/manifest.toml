version = 1

[install]
# ForgeCode (formerly antinomyhq/forge); the binary is still `forge`
forge.pkg-path = "flox/forgecode"
ollama-cuda.pkg-path = "flox/ollama-cuda"
ollama-cuda.pkg-group = "cuda"
ollama-cuda.systems = ["x86_64-linux", "aarch64-linux"]

# Override the macOS ollama package from the included flox/ollama environment,
# which still lists x86_64-darwin (no longer supported here). Linux gets
# ollama-cuda from that environment.
ollama.pkg-path = "flox/ollama"
ollama.pkg-group = "ollama"
ollama.systems = ["aarch64-darwin"]

[vars]
# ForgeCode reads FORGE_<key> (nested keys: FORGE_<section>__<key>); see `forge config list`
FORGE_CUSTOM_HISTORY_PATH = "$FLOX_ENV_CACHE/forge_history"
FORGE_HTTP__CONNECT_TIMEOUT_SECS = "30"
FORGE_HTTP__READ_TIMEOUT_SECS = "900"
FORGE_TOOL_TIMEOUT_SECS = "300"

[hook]
on-activate = '''
mkdir -p "$FLOX_ENV_CACHE"
cd "$FLOX_ENV_PROJECT"
'''

[include]
environments = [
    { remote = "flox/ollama" }
]

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
#systems = ["x86_64-linux", "aarch64-darwin"]
