version = 1

[install]
forge.pkg-path = "flox/forge"
ollama-cuda.pkg-path = "flox/ollama-cuda"
ollama-cuda.pkg-group = "cuda"
ollama-cuda.systems = ["x86_64-linux", "aarch64-linux"]

# Override the macOS ollama package from the included flox/ollama environment,
# which still lists x86_64-darwin (no longer supported here). Linux gets
# ollama-cuda from that environment.
ollama.pkg-path = "flox/ollama"
ollama.pkg-group = "ollama"
ollama.systems = ["aarch64-darwin"]

[vars]
FORGE_HISTORY_FILE = "$FLOX_ENV_CACHE/forge_history"
FORGE_HTTP_CONNECT_TIMEOUT = "30"
FORGE_HTTP_READ_TIMEOUT = "900"
FORGE_TOOL_TIMEOUT = "300"

[hook]
on-activate = '''
mkdir -p "$FLOX_ENV_CACHE"
cd "$FLOX_ENV_PROJECT"
'''

[include]
environments = [
    { remote = "flox/ollama" }
]

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
#systems = ["x86_64-linux", "aarch64-darwin"]
