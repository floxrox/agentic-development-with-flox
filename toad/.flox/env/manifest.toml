fish = '''
set -gx VIRTUAL_ENV "$FLOX_ENV_CACHE/venv"
set -gx PATH "$FLOX_ENV_CACHE/venv/bin" $PATH

# Wrapper to unset PYTHONPATH before running toad
function toad
    set -l _had_pp (set -q PYTHONPATH; and echo 1; or echo 0)
    set -l _saved_pp $PYTHONPATH
    set -e PYTHONPATH
    command toad $argv
    if test "$_had_pp" = "1"
        set -gx PYTHONPATH $_saved_pp
    end
end

function toad-info
    echo "Toad Environment Configuration"
    echo ""
    echo "Commands:"
    echo "  toad                         Launch the TUI"
    echo "  toad ~/projects/my-app       Open a specific project"
    echo "  toad -a <agent>              Launch with a specific agent"
    echo "  toad serve                   Run as a web application"
    echo "  toad --help                  Show all subcommands"
    echo ""
    echo "Supported agents:"
    echo "  Claude (Anthropic), Gemini (Google), Codex (OpenAI),"
    echo "  Open Hands, and more via Agent Client Protocol"
    echo ""
    echo "Venv: $FLOX_ENV_CACHE/venv"
    echo "Update: toad-update"
end

function toad-update
    uv pip install --python "$FLOX_ENV_CACHE/venv/bin/python" -U batrachian-toad
    rm -f "$FLOX_ENV_CACHE/.deps_installed"
    touch "$FLOX_ENV_CACHE/.deps_installed"
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-darwin",
  "x86_64-linux",
]
