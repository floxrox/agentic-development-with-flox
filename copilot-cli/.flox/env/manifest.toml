## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
github-copilot-cli.pkg-path = "github-copilot-cli"
github-copilot-cli.pkg-group = "main"

# Flox skills (flox, floxify, flox-debug) - teach Copilot CLI to manage Flox environments
skills-flox.pkg-path = "flox/skills-flox"
skills-flox.pkg-group = "flox-skills"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]


## Activation Hook ---------------------------------------------------
[hook]
on-activate = '''
# Add the Flox skills to Copilot's skill search path (comma-separated)
setup_copilot_flox_skills() {
    local skills_dir="$FLOX_ENV/share/flox/codex/flox"
    [ -d "$skills_dir" ] || return 0
    case ",${COPILOT_SKILLS_DIRS:-}," in
        *",$skills_dir,"*) ;;
        *) export COPILOT_SKILLS_DIRS="$skills_dir${COPILOT_SKILLS_DIRS:+,$COPILOT_SKILLS_DIRS}" ;;
    esac
}

setup_copilot_flox_skills

echo ""
echo "GitHub Copilot CLI - AI Coding Agent in Your Terminal"
echo ""
echo "Copilot CLI brings the power of GitHub Copilot directly to your command line."
echo ""
echo "First-time setup:"
echo "  copilot                     # Launch interactive session"
echo "  /login                      # Authenticate with GitHub (in session)"
echo ""
echo "Usage:"
echo "  copilot                     # Start conversational coding assistant"
echo "  copilot --help              # Show all options"
echo ""
echo "In-session commands:"
echo "  /login                      # Authenticate with GitHub"
echo "  /model                      # Switch AI models (Claude Sonnet 4.5, GPT-5)"
echo "  /mcp                        # View and manage MCP servers"
echo "  /feedback                   # Submit feedback"
echo ""
echo "Features:"
echo "  • Natural language conversations about code"
echo "  • Build, debug, and understand code"
echo "  • GitHub context awareness (repos, issues, PRs)"
echo "  • Preview-before-execution safety"
echo "  • MCP extensibility"
echo "  • Flox skills (flox, floxify, flox-debug) - see /skills in session"
echo ""
echo "Requires: GitHub Copilot subscription (Plus, Pro, Team, or Enterprise)"
echo ""
'''


## Profile script ----------------------------------------------------
[profile]
# No helper functions needed - copilot is self-contained


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
