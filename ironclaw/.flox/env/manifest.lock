{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.11.0",
    "install": {
      "bat": {
        "pkg-path": "bat"
      },
      "curl": {
        "pkg-path": "curl"
      },
      "git": {
        "pkg-path": "gitFull",
        "outputs": "all"
      },
      "openssl": {
        "pkg-path": "openssl",
        "outputs": "all"
      },
      "pkg-config": {
        "pkg-path": "pkg-config"
      },
      "postgresql": {
        "pkg-path": "postgresql"
      },
      "rustup": {
        "pkg-path": "rustup"
      }
    },
    "vars": {
      "IRONCLAW_HOME": "$FLOX_ENV_CACHE/ironclaw"
    },
    "hook": {
      "on-activate": "# === IRONCLAW HOME ===\nexport IRONCLAW_HOME=\"${IRONCLAW_HOME:-$FLOX_ENV_CACHE/ironclaw}\"\nexport IRONCLAW_BASE_DIR=\"$IRONCLAW_HOME\"\nmkdir -p \"$IRONCLAW_HOME\"\n\n# === CARGO INSTALL ===\nexport CARGO_INSTALL_ROOT=\"$FLOX_ENV_CACHE/cargo-bin\"\nexport PATH=\"$CARGO_INSTALL_ROOT/bin:$PATH\"\n\n# Ensure rustup has a stable toolchain (ironclaw requires Rust 1.92+)\nif ! rustup show active-toolchain >/dev/null 2>&1; then\n  echo \"Installing Rust stable toolchain...\"\n  rustup default stable --quiet 2>/dev/null\nfi\n\n# Update to latest stable if current rustc is too old (ironclaw requires 1.92+)\n_rustc_minor=$(rustc --version 2>/dev/null | grep -oP '1\\.(\\d+)' | grep -oP '\\d+$' || echo \"0\")\nif [ \"$_rustc_minor\" -lt 92 ]; then\n  echo \"Updating Rust toolchain (ironclaw requires 1.92+)...\"\n  rustup update stable --quiet 2>/dev/null\nfi\nunset _rustc_minor\n\n# Install ironclaw if not present\nif [ ! -f \"$CARGO_INSTALL_ROOT/bin/ironclaw\" ]; then\n  echo \"Installing ironclaw (this may take a few minutes on first run)...\"\n  CARGO_INSTALL_ROOT=\"$CARGO_INSTALL_ROOT\" cargo install ironclaw --version 0.24.0 2>&1 | tail -1\n  echo \"\"\nfi\n\n# === PORT MANAGEMENT ===\n# Default webhook port; user can override with HTTP_PORT=<port>\nexport HTTP_PORT=\"${HTTP_PORT:-8080}\"\nexport HTTP_HOST=\"${HTTP_HOST:-127.0.0.1}\"\n\n# Check if a port is in use. Uses lsof (precise) with ss fallback.\n_port_in_use() {\n  lsof -iTCP:\"$1\" -sTCP:LISTEN >/dev/null 2>&1 || \\\n    ss -tlnH 2>/dev/null | awk '{print $4}' | grep -qE \"[:.]$1$\"\n}\n\n# KILL=1 reclaims the port by killing whatever occupies it\n# Otherwise, auto-fallback to next available port\nif _port_in_use \"$HTTP_PORT\"; then\n  if [ \"${KILL:-0}\" = \"1\" ]; then\n    _pid=$(lsof -iTCP:\"${HTTP_PORT}\" -sTCP:LISTEN -t 2>/dev/null | head -1)\n    if [ -n \"$_pid\" ]; then\n      echo \"  Reclaiming port ${HTTP_PORT} (killing PID $_pid)...\"\n      kill \"$_pid\" 2>/dev/null\n      sleep 1\n    fi\n    unset _pid\n  else\n    # Find next available port starting from HTTP_PORT+1\n    _port=$((HTTP_PORT + 1))\n    while _port_in_use \"$_port\"; do\n      _port=$((_port + 1))\n      if [ \"$_port\" -gt \"$((HTTP_PORT + 100))\" ]; then\n        echo \"  WARNING: Could not find free port near ${HTTP_PORT}\"\n        _port=\"$HTTP_PORT\"\n        break\n      fi\n    done\n    if [ \"$_port\" != \"$HTTP_PORT\" ]; then\n      echo \"  Port ${HTTP_PORT} in use, using ${_port} instead\"\n    fi\n    export HTTP_PORT=\"$_port\"\n    unset _port\n  fi\nfi\nunset -f _port_in_use\n\n# === POSTGRESQL SETUP ===\n# PostgreSQL data dir for pgvector persistent memory\nexport PGDATA=\"${PGDATA:-$FLOX_ENV_CACHE/pgdata}\"\nexport PGPORT=\"${PGPORT:-15432}\"\nexport PGHOST=\"$FLOX_ENV_CACHE\"\nexport PGDATABASE=\"${PGDATABASE:-ironclaw}\"\n\n# Initialize PostgreSQL data directory if missing\nif [ ! -d \"$PGDATA\" ]; then\n  echo \"Initializing PostgreSQL data directory...\"\n  initdb --no-locale --encoding=UTF8 -D \"$PGDATA\" >/dev/null 2>&1\n  # Configure for local socket connections only\n  echo \"unix_socket_directories = '$FLOX_ENV_CACHE'\" >> \"$PGDATA/postgresql.conf\"\n  echo \"port = $PGPORT\" >> \"$PGDATA/postgresql.conf\"\n  echo \"listen_addresses = ''\" >> \"$PGDATA/postgresql.conf\"\nfi\n\n# DATABASE_URL detection happens in [profile] (after services start)\n\n# === DISPLAY CONFIGURATION ===\necho \"\"\necho \"IronClaw environment ready\"\necho \"\"\n\n# Show API key status\n_has_key=0\nif [ -n \"$ANTHROPIC_API_KEY\" ]; then\n  echo \"  Anthropic API key: set\"\n  _has_key=1\nelse\n  echo \"  Anthropic API key: not set\"\nfi\nif [ -n \"$OPENAI_API_KEY\" ]; then\n  echo \"  OpenAI API key: set\"\n  _has_key=1\nelse\n  echo \"  OpenAI API key: not set\"\nfi\necho \"  IRONCLAW_HOME: $IRONCLAW_HOME\"\necho \"  Webhook: http://${HTTP_HOST}:${HTTP_PORT}\"\necho \"\"\n\nif [ \"$_has_key\" = \"0\" ]; then\n  echo \"  Set an API key or run the onboarding wizard:\"\n  echo \"    export ANTHROPIC_API_KEY=sk-ant-...\"\n  echo \"    ironclaw onboard\"\n  echo \"\"\nfi\n\necho \"Commands:\"\necho \"  ironclaw                     Start interactive REPL\"\necho \"  ironclaw onboard             First-time setup wizard\"\necho \"  ironclaw-info                Show configuration\"\necho \"\"\necho \"With PostgreSQL (pgvector memory):\"\necho \"  flox activate -s             Start PostgreSQL + enable pgvector\"\necho \"  flox activate                libSQL only (no services needed)\"\necho \"\"\necho \"Port conflict? Options:\"\necho \"  HTTP_PORT=9090 flox activate  Use a different port\"\necho \"  KILL=1 flox activate          Kill process on port ${HTTP_PORT} and reclaim it\"\necho \"\"\n\n# First-time setup check\nif [ ! -f \"$IRONCLAW_HOME/.env\" ] && [ ! -f \"$IRONCLAW_HOME/config.toml\" ]; then\n  echo \"First time? Run: ironclaw onboard\"\n  echo \"\"\nfi\n\nunset _has_key\n"
    },
    "profile": {
      "bash": "export PATH=\"$FLOX_ENV_CACHE/cargo-bin/bin:$PATH\"\n\n# Detect PostgreSQL and set DATABASE_URL if running\nif pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1; then\n  export DATABASE_URL=\"postgres://$PGHOST:$PGPORT/$PGDATABASE\"\n  export DATABASE_BACKEND=\"postgres\"\n  echo \"  Database: PostgreSQL (port $PGPORT, pgvector enabled)\"\n  echo \"\"\nelif [ -d \"$PGDATA\" ] && flox services status 2>/dev/null | grep -q \"postgres\"; then\n  for _pg_i in $(seq 1 10); do\n    if pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1; then\n      export DATABASE_URL=\"postgres://$PGHOST:$PGPORT/$PGDATABASE\"\n      export DATABASE_BACKEND=\"postgres\"\n      echo \"  Database: PostgreSQL (port $PGPORT, pgvector enabled)\"\n      echo \"\"\n      break\n    fi\n    sleep 1\n  done\n  unset _pg_i\n  if [ -z \"$DATABASE_URL\" ]; then\n    echo \"  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment\"\n    echo \"\"\n  fi\nelse\n  echo \"  Database: libSQL (embedded)\"\n  echo \"\"\nfi\n\nironclaw-info() {\n    echo \"IronClaw Environment Configuration\"\n    echo \"\"\n    echo \"IRONCLAW_HOME: ${IRONCLAW_HOME}\"\n    echo \"IRONCLAW_BASE_DIR: ${IRONCLAW_BASE_DIR}\"\n    echo \"\"\n    echo \"API Keys:\"\n    [ -n \"$ANTHROPIC_API_KEY\" ] && echo \"  Anthropic: set\" || echo \"  Anthropic: not set\"\n    [ -n \"$OPENAI_API_KEY\" ] && echo \"  OpenAI: set\" || echo \"  OpenAI: not set\"\n    if [ -n \"$LLM_BACKEND\" ]; then\n        echo \"  LLM backend: ${LLM_BACKEND}\"\n    fi\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  ironclaw                     Start interactive REPL\"\n    echo \"  ironclaw onboard             First-time setup wizard\"\n    echo \"\"\n    echo \"Database setup (for pgvector memory):\"\n    echo \"  createdb ironclaw\"\n    echo \"  psql ironclaw -c \\\"CREATE EXTENSION IF NOT EXISTS vector;\\\"\"\n    echo \"\"\n    echo \"LLM backend examples:\"\n    echo \"  LLM_BACKEND=anthropic ironclaw\"\n    echo \"  LLM_BACKEND=openai ironclaw\"\n    echo \"  LLM_BACKEND=ollama ironclaw\"\n    echo \"  LLM_BACKEND=openai_compatible LLM_BASE_URL=http://localhost:1234/v1 ironclaw\"\n    echo \"\"\n    echo \"Providers: NEAR AI (default), Anthropic, OpenAI, Google Gemini,\"\n    echo \"  GitHub Copilot, Ollama, Mistral, OpenRouter, Together AI, and more\"\n    echo \"\"\n    echo \"Config: \\$IRONCLAW_HOME/.env\"\n}\nexport -f ironclaw-info\n",
      "zsh": "export PATH=\"$FLOX_ENV_CACHE/cargo-bin/bin:$PATH\"\n\n# Detect PostgreSQL and set DATABASE_URL if running\nif pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1; then\n  export DATABASE_URL=\"postgres://$PGHOST:$PGPORT/$PGDATABASE\"\n  export DATABASE_BACKEND=\"postgres\"\n  echo \"  Database: PostgreSQL (port $PGPORT, pgvector enabled)\"\n  echo \"\"\nelif [ -d \"$PGDATA\" ] && flox services status 2>/dev/null | grep -q \"postgres\"; then\n  for _pg_i in $(seq 1 10); do\n    if pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1; then\n      export DATABASE_URL=\"postgres://$PGHOST:$PGPORT/$PGDATABASE\"\n      export DATABASE_BACKEND=\"postgres\"\n      echo \"  Database: PostgreSQL (port $PGPORT, pgvector enabled)\"\n      echo \"\"\n      break\n    fi\n    sleep 1\n  done\n  unset _pg_i\n  if [ -z \"$DATABASE_URL\" ]; then\n    echo \"  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment\"\n    echo \"\"\n  fi\nelse\n  echo \"  Database: libSQL (embedded)\"\n  echo \"\"\nfi\n\nironclaw-info() {\n    echo \"IronClaw Environment Configuration\"\n    echo \"\"\n    echo \"IRONCLAW_HOME: ${IRONCLAW_HOME}\"\n    echo \"IRONCLAW_BASE_DIR: ${IRONCLAW_BASE_DIR}\"\n    echo \"\"\n    echo \"API Keys:\"\n    [ -n \"$ANTHROPIC_API_KEY\" ] && echo \"  Anthropic: set\" || echo \"  Anthropic: not set\"\n    [ -n \"$OPENAI_API_KEY\" ] && echo \"  OpenAI: set\" || echo \"  OpenAI: not set\"\n    if [ -n \"$LLM_BACKEND\" ]; then\n        echo \"  LLM backend: ${LLM_BACKEND}\"\n    fi\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  ironclaw                     Start interactive REPL\"\n    echo \"  ironclaw onboard             First-time setup wizard\"\n    echo \"\"\n    echo \"Database setup (for pgvector memory):\"\n    echo \"  createdb ironclaw\"\n    echo \"  psql ironclaw -c \\\"CREATE EXTENSION IF NOT EXISTS vector;\\\"\"\n    echo \"\"\n    echo \"LLM backend examples:\"\n    echo \"  LLM_BACKEND=anthropic ironclaw\"\n    echo \"  LLM_BACKEND=openai ironclaw\"\n    echo \"  LLM_BACKEND=ollama ironclaw\"\n    echo \"  LLM_BACKEND=openai_compatible LLM_BASE_URL=http://localhost:1234/v1 ironclaw\"\n    echo \"\"\n    echo \"Providers: NEAR AI (default), Anthropic, OpenAI, Google Gemini,\"\n    echo \"  GitHub Copilot, Ollama, Mistral, OpenRouter, Together AI, and more\"\n    echo \"\"\n    echo \"Config: \\$IRONCLAW_HOME/.env\"\n}\n",
      "fish": "set -gx PATH \"$FLOX_ENV_CACHE/cargo-bin/bin\" $PATH\n\n# Detect PostgreSQL and set DATABASE_URL if running\nif pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1\n    set -gx DATABASE_URL \"postgres://$PGHOST:$PGPORT/$PGDATABASE\"\n    set -gx DATABASE_BACKEND \"postgres\"\n    echo \"  Database: PostgreSQL (port $PGPORT, pgvector enabled)\"\n    echo \"\"\nelse if test -d \"$PGDATA\"; and flox services status 2>/dev/null | grep -q \"postgres\"\n    for _pg_i in (seq 1 10)\n        if pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1\n            set -gx DATABASE_URL \"postgres://$PGHOST:$PGPORT/$PGDATABASE\"\n            set -gx DATABASE_BACKEND \"postgres\"\n            echo \"  Database: PostgreSQL (port $PGPORT, pgvector enabled)\"\n            echo \"\"\n            break\n        end\n        sleep 1\n    end\n    if not set -q DATABASE_URL\n        echo \"  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment\"\n        echo \"\"\n    end\nelse\n    echo \"  Database: libSQL (embedded)\"\n    echo \"\"\nend\n\nfunction ironclaw-info\n    echo \"IronClaw Environment Configuration\"\n    echo \"\"\n    echo \"IRONCLAW_HOME: $IRONCLAW_HOME\"\n    echo \"IRONCLAW_BASE_DIR: $IRONCLAW_BASE_DIR\"\n    echo \"\"\n    echo \"API Keys:\"\n    if test -n \"$ANTHROPIC_API_KEY\"\n        echo \"  Anthropic: set\"\n    else\n        echo \"  Anthropic: not set\"\n    end\n    if test -n \"$OPENAI_API_KEY\"\n        echo \"  OpenAI: set\"\n    else\n        echo \"  OpenAI: not set\"\n    end\n    if test -n \"$LLM_BACKEND\"\n        echo \"  LLM backend: $LLM_BACKEND\"\n    end\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  ironclaw                     Start interactive REPL\"\n    echo \"  ironclaw onboard             First-time setup wizard\"\n    echo \"\"\n    echo \"Database setup (for pgvector memory):\"\n    echo \"  createdb ironclaw\"\n    echo \"  psql ironclaw -c \\\"CREATE EXTENSION IF NOT EXISTS vector;\\\"\"\n    echo \"\"\n    echo \"LLM backend examples:\"\n    echo \"  LLM_BACKEND=anthropic ironclaw\"\n    echo \"  LLM_BACKEND=openai ironclaw\"\n    echo \"  LLM_BACKEND=ollama ironclaw\"\n    echo \"  LLM_BACKEND=openai_compatible LLM_BASE_URL=http://localhost:1234/v1 ironclaw\"\n    echo \"\"\n    echo \"Providers: NEAR AI (default), Anthropic, OpenAI, Google Gemini,\"\n    echo \"  GitHub Copilot, Ollama, Mistral, OpenRouter, Together AI, and more\"\n    echo \"\"\n    echo \"Config: \\$IRONCLAW_HOME/.env\"\nend\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    },
    "services": {
      "postgres": {
        "command": "export PGDATA=\"${PGDATA:-$FLOX_ENV_CACHE/pgdata}\"\nexport PGPORT=\"${PGPORT:-15432}\"\nexport PGHOST=\"$FLOX_ENV_CACHE\"\nexport PGDATABASE=\"${PGDATABASE:-ironclaw}\"\n\n# Start PostgreSQL in the background, then run setup\npostgres -D \"$PGDATA\" -k \"$PGHOST\" -p \"$PGPORT\" &\nPG_PID=$!\n\n# Wait for it to accept connections\nfor i in $(seq 1 30); do\n  pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1 && break\n  sleep 1\ndone\n\n# Create database and pgvector extension if needed\nif pg_isready -h \"$PGHOST\" -p \"$PGPORT\" >/dev/null 2>&1; then\n  if ! psql -h \"$PGHOST\" -p \"$PGPORT\" -lqt 2>/dev/null | grep -qw \"$PGDATABASE\"; then\n    createdb -h \"$PGHOST\" -p \"$PGPORT\" \"$PGDATABASE\" 2>/dev/null\n  fi\n  psql -h \"$PGHOST\" -p \"$PGPORT\" -d \"$PGDATABASE\" -c \"CREATE EXTENSION IF NOT EXISTS vector;\" >/dev/null 2>&1\n  echo \"PostgreSQL ready: $PGDATABASE on port $PGPORT (pgvector enabled)\"\nfi\n\n# Keep service alive by waiting on postgres\nwait $PG_PID\n",
        "is-daemon": false
      }
    }
  },
