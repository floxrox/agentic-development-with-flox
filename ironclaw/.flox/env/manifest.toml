fish = '''
set -gx PATH "$FLOX_ENV_CACHE/cargo-bin/bin" $PATH

# Detect PostgreSQL and set DATABASE_URL if running
if pg_isready -h "$PGHOST" -p "$PGPORT" >/dev/null 2>&1
    set -gx DATABASE_URL "postgres://$PGHOST:$PGPORT/$PGDATABASE"
    set -gx DATABASE_BACKEND "postgres"
    echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
    echo ""
else if test -d "$PGDATA"; and flox services status 2>/dev/null | grep -q "postgres"
    for _pg_i in (seq 1 10)
        if pg_isready -h "$PGHOST" -p "$PGPORT" >/dev/null 2>&1
            set -gx DATABASE_URL "postgres://$PGHOST:$PGPORT/$PGDATABASE"
            set -gx DATABASE_BACKEND "postgres"
            echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
            echo ""
            break
        end
        sleep 1
    end
    if not set -q DATABASE_URL
        echo "  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment"
        echo ""
    end
else
    echo "  Database: libSQL (embedded)"
    echo ""
end

function ironclaw-info
    echo "IronClaw Environment Configuration"
    echo ""
    echo "IRONCLAW_HOME: $IRONCLAW_HOME"
    echo "IRONCLAW_BASE_DIR: $IRONCLAW_BASE_DIR"
    echo ""
    echo "API Keys:"
    if test -n "$ANTHROPIC_API_KEY"
        echo "  Anthropic: set"
    else
        echo "  Anthropic: not set"
    end
    if test -n "$OPENAI_API_KEY"
        echo "  OpenAI: set"
    else
        echo "  OpenAI: not set"
    end
    if test -n "$LLM_BACKEND"
        echo "  LLM backend: $LLM_BACKEND"
    end
    echo ""
    echo "Commands:"
    echo "  ironclaw                     Start interactive REPL"
    echo "  ironclaw onboard             First-time setup wizard"
    echo ""
    echo "Database setup (for pgvector memory):"
    echo "  createdb ironclaw"
    echo "  psql ironclaw -c \"CREATE EXTENSION IF NOT EXISTS vector;\""
    echo ""
    echo "LLM backend examples:"
    echo "  LLM_BACKEND=anthropic ironclaw"
    echo "  LLM_BACKEND=openai ironclaw"
    echo "  LLM_BACKEND=ollama ironclaw"
    echo "  LLM_BACKEND=openai_compatible LLM_BASE_URL=http://localhost:1234/v1 ironclaw"
    echo ""
    echo "Providers: NEAR AI (default), Anthropic, OpenAI, Google Gemini,"
    echo "  GitHub Copilot, Ollama, Mistral, OpenRouter, Together AI, and more"
    echo ""
    echo "Config: \$IRONCLAW_HOME/.env"
end
'''

[options]
systems = [
  "aarch64-darwin",
