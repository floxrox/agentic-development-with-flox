schema-version = "1.11.0"

[install]
ironclaw.pkg-path = "flox/ironclaw"
ironclaw.pkg-group = "ironclaw"
# PostgreSQL for pgvector persistent memory and direct psql access
postgresql.pkg-path = "postgresql"
git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[vars]
IRONCLAW_HOME = "$FLOX_ENV_CACHE/ironclaw"

# API keys - set in your shell profile or pass at activation time
# ANTHROPIC_API_KEY = ""
# OPENAI_API_KEY = ""
# LLM_BACKEND = ""  (anthropic, openai, ollama, openai_compatible, etc.)
# LLM_BASE_URL = ""  (for openai_compatible backends)
# LLM_API_KEY = ""   (for openai_compatible backends)

[hook]
on-activate = '''
# === IRONCLAW HOME ===
export IRONCLAW_HOME="${IRONCLAW_HOME:-$FLOX_ENV_CACHE/ironclaw}"
export IRONCLAW_BASE_DIR="$IRONCLAW_HOME"
mkdir -p "$IRONCLAW_HOME"

# === HTTP WEBHOOK SECRET ===
# Generate a random secret if not set (required for HTTP webhook channel)
if [ -z "$HTTP_WEBHOOK_SECRET" ]; then
  export HTTP_WEBHOOK_SECRET=$(openssl rand -hex 32)
fi

# === PORT MANAGEMENT ===
export HTTP_PORT="${HTTP_PORT:-8080}"
export HTTP_HOST="${HTTP_HOST:-127.0.0.1}"

# Use bundled port checker (honors KILL=1)
_resolved_port=$(ironclaw-port-check "$HTTP_PORT" 2>/dev/null)
if [ -n "$_resolved_port" ] && [ "$_resolved_port" != "$HTTP_PORT" ]; then
  echo "  Port ${HTTP_PORT} in use, using ${_resolved_port} instead"
  export HTTP_PORT="$_resolved_port"
fi
unset _resolved_port

# === POSTGRESQL SETUP ===
export PGDATA="${PGDATA:-$FLOX_ENV_CACHE/pgdata}"
export PGPORT="${PGPORT:-15432}"
export PGHOST="$FLOX_ENV_CACHE"
export PGDATABASE="${PGDATABASE:-ironclaw}"

# Initialize PostgreSQL data directory if missing
if [ ! -d "$PGDATA" ]; then
  ironclaw-pg-init
fi

# === DISPLAY CONFIGURATION ===
echo ""
echo "IronClaw environment ready"
echo ""

# Show API key status
_has_key=0
if [ -n "$ANTHROPIC_API_KEY" ]; then
  echo "  Anthropic API key: set"
  _has_key=1
else
  echo "  Anthropic API key: not set"
fi
if [ -n "$OPENAI_API_KEY" ]; then
  echo "  OpenAI API key: set"
  _has_key=1
else
  echo "  OpenAI API key: not set"
fi
echo "  IRONCLAW_HOME: $IRONCLAW_HOME"
echo "  Webhook: http://${HTTP_HOST}:${HTTP_PORT}"
echo ""

if [ "$_has_key" = "0" ]; then
  echo "  Set an API key or run the onboarding wizard:"
  echo "    export ANTHROPIC_API_KEY=sk-ant-..."
  echo "    ironclaw onboard"
  echo ""
fi

echo "Commands:"
echo "  ironclaw                     Start interactive REPL"
echo "  ironclaw onboard             First-time setup wizard"
echo "  ironclaw-info                Show configuration"
echo ""
echo "With PostgreSQL (pgvector memory):"
echo "  flox activate -s             Start PostgreSQL + enable pgvector"
echo "  flox activate                libSQL only (no services needed)"
echo ""
echo "Port conflict? Options:"
echo "  HTTP_PORT=9090 flox activate  Use a different port"
echo "  KILL=1 flox activate          Kill process on port ${HTTP_PORT} and reclaim it"
echo ""

# First-time setup check
if [ ! -f "$IRONCLAW_HOME/.env" ] && [ ! -f "$IRONCLAW_HOME/config.toml" ]; then
  echo "First time? Run: ironclaw onboard"
  echo ""
fi

unset _has_key
'''

[services.postgres]
command = """
export PGDATA="${PGDATA:-$FLOX_ENV_CACHE/pgdata}"
export PGPORT="${PGPORT:-15432}"
export PGHOST="$FLOX_ENV_CACHE"
export PGDATABASE="${PGDATABASE:-ironclaw}"
exec ironclaw-pg-start
"""
is-daemon = false

[profile]
bash = '''
# Detect PostgreSQL and set DATABASE_URL via bundled script
_db_url=$(ironclaw-pg-detect 2>/dev/null)
if [ -n "$_db_url" ]; then
  export DATABASE_URL="$_db_url"
  export DATABASE_BACKEND="postgres"
  echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
  echo ""
elif [ -d "$PGDATA" ] && flox services status 2>/dev/null | grep -q "postgres"; then
  for _pg_i in $(seq 1 10); do
    _db_url=$(ironclaw-pg-detect 2>/dev/null)
    if [ -n "$_db_url" ]; then
      export DATABASE_URL="$_db_url"
      export DATABASE_BACKEND="postgres"
      echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
      echo ""
      break
    fi
    sleep 1
  done
  unset _pg_i
  if [ -z "$DATABASE_URL" ]; then
    echo "  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment"
    echo ""
  fi
else
  echo "  Database: libSQL (embedded)"
  echo ""
fi
unset _db_url
'''

zsh = '''
# Detect PostgreSQL and set DATABASE_URL via bundled script
_db_url=$(ironclaw-pg-detect 2>/dev/null)
if [ -n "$_db_url" ]; then
  export DATABASE_URL="$_db_url"
  export DATABASE_BACKEND="postgres"
  echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
  echo ""
elif [ -d "$PGDATA" ] && flox services status 2>/dev/null | grep -q "postgres"; then
  for _pg_i in $(seq 1 10); do
    _db_url=$(ironclaw-pg-detect 2>/dev/null)
    if [ -n "$_db_url" ]; then
      export DATABASE_URL="$_db_url"
      export DATABASE_BACKEND="postgres"
      echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
      echo ""
      break
    fi
    sleep 1
  done
  unset _pg_i
  if [ -z "$DATABASE_URL" ]; then
    echo "  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment"
    echo ""
  fi
else
  echo "  Database: libSQL (embedded)"
  echo ""
fi
unset _db_url
'''

fish = '''
# Detect PostgreSQL and set DATABASE_URL via bundled script
set -l _db_url (ironclaw-pg-detect 2>/dev/null)
if test -n "$_db_url"
    set -gx DATABASE_URL "$_db_url"
    set -gx DATABASE_BACKEND "postgres"
    echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
    echo ""
else if test -d "$PGDATA"; and flox services status 2>/dev/null | grep -q "postgres"
    for _pg_i in (seq 1 10)
        set _db_url (ironclaw-pg-detect 2>/dev/null)
        if test -n "$_db_url"
            set -gx DATABASE_URL "$_db_url"
            set -gx DATABASE_BACKEND "postgres"
            echo "  Database: PostgreSQL (port $PGPORT, pgvector enabled)"
            echo ""
            break
        end
        sleep 1
    end
    if not set -q DATABASE_URL
        echo "  Database: libSQL (embedded) -- PostgreSQL starting, try 'ironclaw' in a moment"
        echo ""
    end
else
    echo "  Database: libSQL (embedded)"
    echo ""
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-darwin",
  "x86_64-linux",
]
