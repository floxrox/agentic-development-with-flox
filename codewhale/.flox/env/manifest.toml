fish = '''
function codewhale-info
    set -l cw_home $HOME/.codewhale
    if set -q CODEWHALE_HOME; set cw_home $CODEWHALE_HOME; end
    set -l cw_skills $cw_home/skills
    if set -q CODEWHALE_SKILLS_DIR; set cw_skills $CODEWHALE_SKILLS_DIR; end
    echo "Codewhale Environment Configuration"
    echo ""
    echo "API Keys:"
    if test -n "$DEEPSEEK_API_KEY"; echo "  DeepSeek: set"; else; echo "  DeepSeek: not set"; end
    if test -n "$OPENAI_API_KEY"; echo "  OpenAI: set"; else; echo "  OpenAI: not set"; end
    if test -n "$ANTHROPIC_API_KEY"; echo "  Anthropic: set"; else; echo "  Anthropic: not set"; end
    if test -n "$OPENROUTER_API_KEY"; echo "  OpenRouter: set"; else; echo "  OpenRouter: not set"; end
    echo "  (keys saved with 'codewhale auth set' are not shown; see 'codewhale auth status')"
    echo ""
    echo "Flox skills: $cw_skills"
    echo ""
    echo "Commands:"
    echo "  codewhale                    Start interactive TUI"
    echo "  codewhale exec \"<prompt>\"    Run a non-interactive prompt"
    echo "  codewhale review             Review the current git diff"
    echo "  codewhale doctor             Run diagnostics (providers, skills, MCP)"
    echo "  codewhale --provider ollama  Use a local Ollama model"
    echo ""
    echo "Config: $cw_home/config.toml"
    echo "Source: https://github.com/codewhale-hq/CodeWhale"
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
